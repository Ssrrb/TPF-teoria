# ------------------------------------------------------------------------------
# RELACIONES. fk_en/fk_col alimentan el DER; tipo y cardinalidad alimentan UML.
# tipo: composicion | agregacion | asociacion
# ------------------------------------------------------------------------------
relaciones:
  - { a: organizacion, b: obra, tipo: agregacion, ca: "1", cb: "0..*", fk_en: obra, fk_col: organizacion_id }
  - { a: organizacion, b: usuario, tipo: agregacion, ca: "1", cb: "1..*", fk_en: usuario, fk_col: organizacion_id }
  - { a: usuario, b: rol_asignado, tipo: composicion, ca: "1", cb: "0..*", fk_en: rol_asignado, fk_col: usuario_id }
  - { a: obra, b: rol_asignado, tipo: asociacion, ca: "1", cb: "0..*", fk_en: rol_asignado, fk_col: obra_id }
  - { a: cliente, b: obra, tipo: asociacion, ca: "1", cb: "0..*", fk_en: obra, fk_col: cliente_id, rol: "comitente" }
  - { a: obra, b: configuracion_obra, tipo: composicion, ca: "1", cb: "1", fk_en: configuracion_obra, fk_col: obra_id }
  - { a: configuracion_obra, b: fondo_retencion, tipo: composicion, ca: "1", cb: "0..*", fk_en: fondo_retencion, fk_col: configuracion_obra_id }
  - { a: obra, b: presupuesto, tipo: composicion, ca: "1", cb: "1..*", fk_en: presupuesto, fk_col: obra_id }
  - { a: presupuesto, b: version_presupuesto, tipo: composicion, ca: "1", cb: "1..*", fk_en: version_presupuesto, fk_col: presupuesto_id }
  - { a: version_presupuesto, b: linea_presupuesto, tipo: composicion, ca: "1", cb: "1..*", fk_en: linea_presupuesto, fk_col: version_presupuesto_id }
  - { a: linea_presupuesto, b: linea_presupuesto, tipo: asociacion, ca: "0..1", cb: "0..*", fk_en: linea_presupuesto, fk_col: padre_id, rol: "jerarquía rubro/subrubro/ítem" }
  - { a: version_presupuesto, b: archivo_origen, tipo: composicion, ca: "1", cb: "0..1", fk_en: archivo_origen, fk_col: version_presupuesto_id }
  - { a: version_presupuesto, b: informe_importacion, tipo: composicion, ca: "1", cb: "0..1", fk_en: informe_importacion, fk_col: version_presupuesto_id }
  - { a: analisis_costo_unitario, b: linea_presupuesto, tipo: asociacion, ca: "0..1", cb: "0..*", fk_en: linea_presupuesto, fk_col: acu_id }
  - { a: analisis_costo_unitario, b: componente_acu, tipo: composicion, ca: "1", cb: "1..*", fk_en: componente_acu, fk_col: acu_id }
  - { a: obra, b: analisis_costo_unitario, tipo: agregacion, ca: "1", cb: "0..*", fk_en: analisis_costo_unitario, fk_col: obra_id }
  - { a: obra, b: periodo, tipo: composicion, ca: "1", cb: "0..*", fk_en: periodo, fk_col: obra_id }
  - { a: periodo, b: medicion_oficial, tipo: composicion, ca: "1", cb: "0..*", fk_en: medicion_oficial, fk_col: periodo_id }
  - { a: linea_presupuesto, b: medicion_oficial, tipo: asociacion, ca: "1", cb: "0..*", fk_en: medicion_oficial, fk_col: linea_presupuesto_id }
  - { a: version_presupuesto, b: medicion_oficial, tipo: asociacion, ca: "1", cb: "0..*", fk_en: medicion_oficial, fk_col: version_presupuesto_id, rol: "medida contra" }
  - { a: usuario, b: medicion_oficial, tipo: asociacion, ca: "1", cb: "0..*", fk_en: medicion_oficial, fk_col: registrado_por, rol: "registra", detalle: true }
  - { a: usuario, b: medicion_oficial, tipo: asociacion, ca: "0..1", cb: "0..*", fk_en: medicion_oficial, fk_col: decidido_por, rol: "aprueba o rechaza", detalle: true }
  - { a: medicion_oficial, b: evidencia, tipo: composicion, ca: "1", cb: "0..*", fk_en: evidencia, fk_col: medicion_oficial_id }
  - { a: medicion_oficial, b: propuesta_pendiente, tipo: composicion, ca: "1", cb: "0..1", fk_en: propuesta_pendiente, fk_col: medicion_oficial_id }
  - { a: movimiento_presupuestario, b: propuesta_pendiente, tipo: asociacion, ca: "0..1", cb: "0..*", fk_en: propuesta_pendiente, fk_col: movimiento_id, rol: "cubre" }
  - { a: linea_presupuesto, b: movimiento_presupuestario, tipo: asociacion, ca: "1", cb: "0..*", fk_en: movimiento_presupuestario, fk_col: linea_presupuesto_id, rol: "objetivo" }
  - { a: version_presupuesto, b: movimiento_presupuestario, tipo: asociacion, ca: "0..1", cb: "0..*", fk_en: movimiento_presupuestario, fk_col: version_generada_id, rol: "genera" }
  - { a: periodo, b: certificado, tipo: asociacion, ca: "1", cb: "0..*", fk_en: certificado, fk_col: periodo_id }
  - { a: subcontrato, b: certificado, tipo: asociacion, ca: "0..1", cb: "0..*", fk_en: certificado, fk_col: subcontrato_id }
  - { a: certificado, b: revision_certificado, tipo: composicion, ca: "1", cb: "1..*", fk_en: revision_certificado, fk_col: certificado_id }
  - { a: revision_certificado, b: linea_certificado, tipo: composicion, ca: "1", cb: "1..*", fk_en: linea_certificado, fk_col: revision_certificado_id }
  - { a: medicion_oficial, b: linea_certificado, tipo: asociacion, ca: "1", cb: "0..1", fk_en: linea_certificado, fk_col: medicion_oficial_id }
  - { a: linea_presupuesto, b: linea_certificado, tipo: asociacion, ca: "1", cb: "0..*", fk_en: linea_certificado, fk_col: linea_presupuesto_id }
  - { a: revision_certificado, b: aprobacion, tipo: composicion, ca: "0..1", cb: "0..*", fk_en: aprobacion, fk_col: revision_certificado_id }
  - { a: movimiento_presupuestario, b: aprobacion, tipo: composicion, ca: "0..1", cb: "0..*", fk_en: aprobacion, fk_col: movimiento_id }
  - { a: usuario, b: aprobacion, tipo: asociacion, ca: "1", cb: "0..*", fk_en: aprobacion, fk_col: actor_id, detalle: true }
  - { a: revision_certificado, b: retencion_aplicada, tipo: composicion, ca: "1", cb: "0..*", fk_en: retencion_aplicada, fk_col: revision_certificado_id }
  - { a: fondo_retencion, b: retencion_aplicada, tipo: asociacion, ca: "1", cb: "0..*", fk_en: retencion_aplicada, fk_col: fondo_retencion_id }
  - { a: certificado, b: documento_financiero_erp, tipo: asociacion, ca: "1", cb: "0..1", fk_en: documento_financiero_erp, fk_col: certificado_id }
  - { a: obra, b: subcontrato, tipo: agregacion, ca: "1", cb: "0..*", fk_en: subcontrato, fk_col: obra_id }
  - { a: socio, b: subcontrato, tipo: asociacion, ca: "1", cb: "0..*", fk_en: subcontrato, fk_col: socio_id }
  - { a: usuario, b: registro_auditoria, tipo: asociacion, ca: "1", cb: "0..*", fk_en: registro_auditoria, fk_col: actor_id, detalle: true }

# ------------------------------------------------------------------------------
# PUERTOS (interfaces declaradas por el dominio; la infraestructura las implementa).
# ------------------------------------------------------------------------------
puertos:
  - { id: i_presupuesto_repositorio, nombre: IPresupuestoRepositorio, metodos: ["buscarVersionVigente(obraId)", "buscarPorHash(hash)", "guardarVersion(version)"], adaptador: presupuesto_repositorio_sql }
  - { id: i_almacen_archivos, nombre: IAlmacenArchivos, metodos: ["guardar(archivo)", "recuperar(ruta)"], adaptador: almacen_archivos_s3 }
  - { id: i_lector_planilla, nombre: ILectorPlanilla, metodos: ["leer(archivo)", "detectarEstructura(hojas)"], adaptador: lector_planilla_xlsx }
  - { id: i_medicion_repositorio, nombre: IMedicionRepositorio, metodos: ["listarPorPeriodo(periodoId)", "guardar(medicion)", "acumuladoAprobado(lineaId)"], adaptador: medicion_repositorio_sql }
  - { id: i_certificado_repositorio, nombre: ICertificadoRepositorio, metodos: ["buscarRevision(revisionId)", "guardar(certificado)", "siguienteNumero(obraId)"], adaptador: certificado_repositorio_sql }
  - { id: i_generador_documento, nombre: IGeneradorDocumento, metodos: ["exportar(revision, formato)"], adaptador: generador_documento_xlsxpdf }
  - { id: i_publicador_eventos, nombre: IPublicadorEventos, metodos: ["publicar(evento)"], adaptador: puente_erp }
  - { id: i_auditoria_repositorio, nombre: IAuditoriaRepositorio, metodos: ["registrar(entrada)"], adaptador: auditoria_repositorio_sql }
  - { id: i_reloj, nombre: IReloj, metodos: ["ahora()"], adaptador: reloj_sistema }

# ------------------------------------------------------------------------------
# COMPONENTES (clases boundary, control y adaptadores). Un id, un nombre.
# Renombrar una clase = cambiar su 'nombre' aquí; nada más referencia el nombre.
# contenedor (solo adaptadores): dónde vive lo que el adaptador toca (bd | archivos | erp | ecms).
# ------------------------------------------------------------------------------
componentes:
  - { id: importar_presupuesto_controlador, capa: boundary, nombre: ImportarPresupuestoControlador }
  - { id: importacion_presentador, capa: boundary, nombre: ImportacionPresentador }
  - { id: aprobar_medicion_controlador, capa: boundary, nombre: AprobarMedicionControlador }
  - { id: medicion_presentador, capa: boundary, nombre: MedicionPresentador }
  - { id: emitir_certificado_controlador, capa: boundary, nombre: EmitirCertificadoControlador }
  - { id: certificado_presentador, capa: boundary, nombre: CertificadoPresentador }
  - { id: importar_presupuesto_interactor, capa: control, nombre: ImportarPresupuestoInteractor }
  - { id: validar_estructura_servicio, capa: control, nombre: ValidarEstructuraServicio }
  - { id: contrastar_totales_servicio, capa: control, nombre: ContrastarTotalesServicio }
  - { id: aprobar_medicion_interactor, capa: control, nombre: AprobarMedicionInteractor }
  - { id: evaluar_saldo_servicio, capa: control, nombre: EvaluarSaldoServicio }
  - { id: emitir_certificado_interactor, capa: control, nombre: EmitirCertificadoInteractor }
  - { id: verificar_separacion_funciones_servicio, capa: control, nombre: VerificarSeparacionFuncionesServicio }
  - { id: calcular_valorizacion_servicio, capa: control, nombre: CalcularValorizacionServicio }
  - { id: presupuesto_repositorio_sql, capa: adapter, contenedor: bd, nombre: PresupuestoRepositorioSQL }
  - { id: almacen_archivos_s3, capa: adapter, contenedor: archivos, nombre: AlmacenArchivosS3 }
  - { id: lector_planilla_xlsx, capa: adapter, contenedor: ecms, nombre: LectorPlanillaXLSX }
  - { id: medicion_repositorio_sql, capa: adapter, contenedor: bd, nombre: MedicionRepositorioSQL }
  - { id: certificado_repositorio_sql, capa: adapter, contenedor: bd, nombre: CertificadoRepositorioSQL }
  - { id: generador_documento_xlsxpdf, capa: adapter, contenedor: archivos, nombre: GeneradorDocumentoXLSXPDF }
  - { id: puente_erp, capa: adapter, contenedor: erp, nombre: PuenteERP }
  - { id: auditoria_repositorio_sql, capa: adapter, contenedor: bd, nombre: AuditoriaRepositorioSQL }
  - { id: reloj_sistema, capa: adapter, contenedor: ecms, nombre: RelojSistema }

# ------------------------------------------------------------------------------
# CLASES POR CASO DE USO (Clean Architecture proyectada en estereotipos Jacobson).
# ------------------------------------------------------------------------------
clases_cu:
  CU-02:
    boundary: [importar_presupuesto_controlador, importacion_presentador]
    control:  [importar_presupuesto_interactor, validar_estructura_servicio, contrastar_totales_servicio]
    entity:   [obra, presupuesto, version_presupuesto, linea_presupuesto, archivo_origen, informe_importacion]
    puertos:  [i_presupuesto_repositorio, i_almacen_archivos, i_lector_planilla, i_auditoria_repositorio]
  CU-05:
    boundary: [aprobar_medicion_controlador, medicion_presentador]
    control:  [aprobar_medicion_interactor, evaluar_saldo_servicio]
    entity:   [periodo, medicion_oficial, evidencia, linea_presupuesto, version_presupuesto, propuesta_pendiente]
    puertos:  [i_medicion_repositorio, i_presupuesto_repositorio, i_auditoria_repositorio, i_reloj]
  CU-09:
    boundary: [emitir_certificado_controlador, certificado_presentador]
    control:  [emitir_certificado_interactor, verificar_separacion_funciones_servicio, calcular_valorizacion_servicio]
    entity:   [certificado, revision_certificado, linea_certificado, aprobacion, retencion_aplicada, configuracion_obra, fondo_retencion, valorizacion]
    puertos:  [i_certificado_repositorio, i_generador_documento, i_publicador_eventos, i_auditoria_repositorio, i_reloj]

# ------------------------------------------------------------------------------
# MÁQUINAS DE ESTADO. Única declaración: prosa y diagramas leen de aquí.
# ------------------------------------------------------------------------------
estados:
  version_presupuesto:
    inicial: Propuesta
    finales: [Reemplazada, Descartada]
    estados:
      - { n: Propuesta,   d: "Importada y confirmada en su estructura; todavía no rige." }
      - { n: Vigente,     d: "Rige para medición, certificación y control de saldo." }
      - { n: Reemplazada, d: "Un movimiento aprobado generó una versión posterior; permanece consultable." }
      - { n: Descartada,  d: "La importación no se confirmó; no llegó a regir." }
    transiciones:
      - { de: Propuesta, a: Vigente, evento: "activar", guarda: "estructura confirmada" }
      - { de: Propuesta, a: Descartada, evento: "descartar" }
      - { de: Vigente, a: Reemplazada, evento: "activar versión posterior" }
  medicion_oficial:
    inicial: Registrada
    finales: [Aprobada]
    estados:
      - { n: Registrada, d: "Cargada por el Ingeniero de Obra con su evidencia; espera decisión." }
      - { n: Aprobada,   d: "El Responsable Técnico la validó; su cantidad cubierta es certificable." }
      - { n: Rechazada,  d: "Devuelta con motivo; no integra el acumulado físico." }
    transiciones:
      - { de: Registrada, a: Aprobada, evento: "aprobar", guarda: "actor distinto del que registró" }
      - { de: Registrada, a: Rechazada, evento: "rechazar", guarda: "motivo informado" }
      - { de: Rechazada, a: Registrada, evento: "corregir y reenviar" }
  certificado:
    inicial: Borrador
    finales: [Cerrado]
    estados:
      - { n: Borrador, d: "Generado desde mediciones aprobadas elegibles; editable." }
      - { n: Emitido,  d: "Presentado para conformidad técnica y autorización." }
      - { n: Aprobado, d: "Conformado y autorizado por actores distintos; origina el documento financiero ERP." }
      - { n: Cerrado,  d: "Período liquidado; el certificado y sus fuentes permanecen consultables." }
    transiciones:
      - { de: Borrador, a: Emitido, evento: "emitir revisión" }
      - { de: Emitido, a: Borrador, evento: "devolver para corrección", guarda: "observación registrada" }
      - { de: Emitido, a: Aprobado, evento: "autorizar", guarda: "conformidad técnica de un actor distinto" }
      - { de: Aprobado, a: Cerrado, evento: "cerrar período" }
      - { de: Cerrado, a: Borrador, evento: "reapertura autorizada", guarda: "auditada; crea revisión vinculada" }
  movimiento_presupuestario:
    inicial: Propuesto
    finales: [Vigente, Rechazado]
    estados:
      - { n: Propuesto,            d: "Registrado con tipo, objetivo, motivo y respaldo documental." }
      - { n: AprobadoInterno,      d: "La organización lo aprobó; todavía no modifica el presupuesto." }
      - { n: AprobadoContractual,  d: "El comitente lo aceptó; habilita la nueva versión." }
      - { n: Vigente,              d: "Generó una versión de presupuesto nueva que ya rige." }
      - { n: Rechazado,            d: "No prosperó; el presupuesto vigente no cambia." }
    transiciones:
      - { de: Propuesto, a: AprobadoInterno, evento: "aprobar internamente", guarda: "datos completos y dentro del límite" }
      - { de: Propuesto, a: Rechazado, evento: "rechazar" }
      - { de: AprobadoInterno, a: AprobadoContractual, evento: "aprobar contractualmente" }
      - { de: AprobadoInterno, a: Rechazado, evento: "rechazar" }
      - { de: AprobadoContractual, a: Vigente, evento: "activar versión" }

# ------------------------------------------------------------------------------
# SECUENCIAS (diagrama de interacción). Derivan del mismo flujo de la especificación.
# frag: alt|else|loop|opt|end  -> fragmento combinado UML.
# tipo: sync (llamada) | return (respuesta) | create
# ------------------------------------------------------------------------------
secuencias:
  CU-02:
    participantes:
      - { id: ING,  tipo: actor }
      - { id: CTRL, tipo: boundary,  ref: importar_presupuesto_controlador }
      - { id: UC,   tipo: control,   ref: importar_presupuesto_interactor }
      - { id: VAL,  tipo: control,   ref: validar_estructura_servicio }
      - { id: TOT,  tipo: control,   ref: contrastar_totales_servicio }
      - { id: LEC,  tipo: interface, ref: i_lector_planilla }
      - { id: ALM,  tipo: interface, ref: i_almacen_archivos }
      - { id: REP,  tipo: interface, ref: i_presupuesto_repositorio }
      - { id: VER,  tipo: entity,    ref: version_presupuesto }
      - { id: LIN,  tipo: entity,    ref: linea_presupuesto }
    mensajes:
      - { de: ING,  a: CTRL, msg: "importarPresupuesto(obraId, archivo)" }
