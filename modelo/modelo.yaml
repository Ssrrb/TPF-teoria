    - { codigo: ecms.budgets,        nombre: Presupuestos }
    - { codigo: ecms.acu,            nombre: Análisis de Costo Unitario }
    - { codigo: ecms.certifications, nombre: Certificaciones }
    - { codigo: ecms.subcontracts,   nombre: Subcontratos }
    - { codigo: erp.invoices,        nombre: Facturas }
    - { codigo: erp.payments,        nombre: Pagos }
  excluidos:
    - { codigo: ecms.stock,     motivo: "PR-07 excluye la operación de inventario y almacén." }
    - { codigo: ecms.rrhh,      motivo: "Fuera del alcance de presupuesto, medición y certificación." }
