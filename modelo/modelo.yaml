      - { n: limite, t: Decimal, sql: "NUMERIC(24,12)", null: true }
      - { n: estado, t: String, sql: "VARCHAR(24)" }
      - { n: fechaPropuesta, t: DateTime, sql: "TIMESTAMPTZ" }
      - { n: importeUtilizado, t: Decimal, derivado: true }
      - { n: saldoDisponible, t: Decimal, derivado: true }
  - id: certificado
    nombre: Certificado
    paquete: Certificación
    tabla: certificado
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: numero, t: String, sql: "VARCHAR(30)", null: true }
      - { n: tipo, t: String, sql: "VARCHAR(16)" }
      - { n: fechaEmision, t: Date, sql: "DATE", null: true }
      - { n: destinatario, t: String, sql: "VARCHAR(160)", null: true }
      - { n: estado, t: String, sql: "VARCHAR(12)" }
  - id: revision_certificado
    nombre: RevisionCertificado
