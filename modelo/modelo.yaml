# ------------------------------------------------------------------------------
# Alcance: módulos de Obra Studio que este modelo desarrolla.
# ------------------------------------------------------------------------------
alcance:
  incluidos:
    - { codigo: ecms.budgets,        nombre: Presupuestos }
    - { codigo: ecms.acu,            nombre: Análisis de Costo Unitario }
    - { codigo: ecms.certifications, nombre: Certificaciones }
    - { codigo: ecms.subcontracts,   nombre: Subcontratos }
    - { codigo: erp.invoices,        nombre: Facturas }
    - { codigo: erp.payments,        nombre: Pagos }
  excluidos:
    - { codigo: ecms.stock,     motivo: "PR-07 excluye la operación de inventario y almacén." }
    - { codigo: ecms.rrhh,      motivo: "Fuera del alcance de presupuesto, medición y certificación." }
    - { codigo: ecms.partes,    motivo: "La vía C del motor de costos se documenta sin desarrollar partes diarios." }
    - { codigo: erp.petty-cash, motivo: "Compras menores no intervienen en la cadena de certificación." }
    - { codigo: erp.finance,    motivo: "Contabilidad y tesorería se tratan como contexto de interacción ERP." }

# ------------------------------------------------------------------------------
# Vocabulario. Gobierna los nombres usados en TODOS los diagramas.
# clase = nombre en el modelo; implementacion = contraparte en el código real.
# ------------------------------------------------------------------------------
vocabulario:
  - { termino: Obra,                      gloss: work site,              clase: obra,                      implementacion: "projects (fila)" }
  - { termino: Presupuesto,               gloss: budget,                 clase: presupuesto,               implementacion: "ProjectFile / budgets" }
  - { termino: Versión de presupuesto,    gloss: budget version,         clase: version_presupuesto,        implementacion: "budgets.revision + budget_operations" }
  - { termino: Rubro,                     gloss: chapter,                clase: linea_presupuesto,          implementacion: "CostItem.rowType='chapter'" }
  - { termino: Ítem,                      gloss: budget line,            clase: linea_presupuesto,          implementacion: "CostItem.rowType='begrotingspost'" }
  - { termino: ACU,                       gloss: unit cost analysis,     clase: analisis_costo_unitario,     implementacion: "CostItem.acu + calculateAcu()" }
  - { termino: Medición oficial,          gloss: official measurement,   clase: medicion_oficial,           implementacion: "no implementado (especificado)" }
  - { termino: Período,                   gloss: period,                 clase: periodo,                   implementacion: "no implementado (especificado)" }
  - { termino: Certificado de avance,     gloss: advance certificate,    clase: certificado,               implementacion: "no implementado (especificado)" }
  - { termino: Valorización,              gloss: valuation,              clase: valorizacion,              implementacion: "extiende el wiki: importe calculado del certificado" }
  - { termino: Movimiento presupuestario, gloss: budget movement,        clase: movimiento_presupuestario,  implementacion: "budgets kind='adendas', capítulo AD-N" }
  - { termino: Subcontrato,               gloss: subcontract,            clase: subcontrato,               implementacion: "no implementado (especificado)" }
  - { termino: Socio,                     gloss: partner,                clase: socio,                     implementacion: "no implementado (especificado)" }
  - { termino: Curva S,                   gloss: S-curve,                clase: "—",                       derivado_de: [linea_certificado, version_presupuesto, periodo], implementacion: "extiende el wiki: reporte derivado, sin tabla propia" }
  - { termino: Fondo de reparo,           gloss: retention fund,         clase: retencion_aplicada,         implementacion: "no implementado (especificado)" }

# ------------------------------------------------------------------------------
# ACTORES. Un id, un nombre. Todo diagrama los referencia por id.
# tipo: primario | secundario | sistema; externo: true marca a quien no pertenece a la organización;
# interno: true marca un actor sistema que es un motor de Obra Studio (contenedor en C4, D-15).
# Un actor no es un rol: los roles del sistema son los de D-08.
# uso: relación del actor con el sistema en las vistas C4 y en el workspace de Structurizr.
# ------------------------------------------------------------------------------
actores:
  - id: ING
    nombre: Ingeniero de Obra
    tipo: primario
    uso: Carga el presupuesto, registra la medición oficial y emite certificados
    descripcion: >-
      Carga el presupuesto y el cronograma de la obra, registra la medición oficial de cada ítem
      del período con su evidencia, genera y emite los certificados de avance y los corrige.
  - id: SUP
    nombre: Responsable Técnico
    tipo: primario
    uso: Aprueba mediciones y cierra el período
    descripcion: >-
      Supervisor de la obra. Aprueba o rechaza cada medición oficial y cierra el período de medición.
  - id: ADM
    nombre: Administrador
    tipo: primario
    uso: Activa versiones, emite certificados y aprueba movimientos presupuestarios
    descripcion: >-
      Gerente de la obra. Configura la obra, sus impuestos y sus fondos de retención, activa la versión
      de presupuesto, emite certificados de avance y aprueba los movimientos presupuestarios.
  - id: SUB
    nombre: Subcontratista
    tipo: primario
    externo: true
    uso: Consulta el estado de su contrato
    descripcion: >-
      Consulta el estado de sus mediciones, certificados, valorizaciones y saldos. No registra
      mediciones: las de su trabajo las mide en terreno y las carga el Ingeniero de Obra. No accede a
      información de otros contratos ni a datos internos de la obra.
  - id: CLI
    nombre: Cliente
    tipo: secundario
    externo: true
    descripcion: >-
      Comitente de la obra. Acepta contractualmente los movimientos presupuestarios y recibe la factura
      que el ERP deriva de lo certificado.
  - id: ECMS
    nombre: Motor de Ingeniería
    tipo: sistema
    interno: true
    descripcion: >-
      Motor de obra de Obra Studio. Calcula los costos por vía de material, mano de obra y equipo a
      partir del análisis de costo unitario, y publica el certificado emitido para que el ERP
      derive su documento financiero. Es la fuente de verdad de la medición.
  - id: ERP
    nombre: Motor ERP
    tipo: sistema
    interno: true
    descripcion: >-
      Motor financiero y documental de Obra Studio. Recibe los certificados emitidos, los refleja en
      el avance físico-financiero de la obra y genera la factura al cliente a partir del certificado
      interno o el pago al subcontratista. Es dueño de los documentos legales; no calcula costo de obra.
  - id: TES
    nombre: Finanzas y Tesorería
    tipo: secundario
    uso: Aprueba y ejecuta pagos y registra cobros
    descripcion: >-
      Opera dentro del ERP. Aprueba y ejecuta pagos y registra cobros a partir de los documentos
      derivados de un certificado emitido.

# ------------------------------------------------------------------------------
# GENERALIZACIÓN DE ACTORES. Padres abstractos: agrupan el acceso común y no tienen casos de uso
# propios, porque el hijo heredaría todos los del padre (D-20). hijos: ids de actores.
# ------------------------------------------------------------------------------
generalizacion_actores:
  - id: USR
    nombre: Usuario de Obra
    descripcion: >-
      Usuario interno con rol vigente sobre la obra. Agrupa el acceso común que exige RNF-01:
      organización, pertenencia a la obra y rol se comprueban antes de leer o modificar información.
    hijos: [ING, SUP, ADM]
  - id: MOT
    nombre: Motor de Obra Studio
    descripcion: >-
      Proceso que un motor de Obra Studio ejecuta sin intervención de un usuario: el cálculo por
      vía, la publicación del certificado emitido y la derivación del documento financiero (D-15).
    hijos: [ECMS, ERP]

# ------------------------------------------------------------------------------
# REQUISITOS. 48 identificadores: RF-01..28, RNF-01..12, PR-01..08.
# casos_uso[] es la trazabilidad; de aquí sale la matriz. No duplicar en prosa.
# ------------------------------------------------------------------------------
requisitos:
  # --- Funcionales -------------------------------------------------------------
  - id: RF-01
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá crear una obra con datos identificatorios y asignar sus responsables.
    criterio: Cada obra queda asociada a responsables y organización.
    casos_uso: [CU-01]
  - id: RF-02
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema permitirá cargar el XLSX de presupuesto y cronograma y conservar el archivo
      original asociado a su versión.
    criterio: Se recupera el archivo de origen de una versión.
    casos_uso: [CU-02]
  - id: RF-03
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema identificará hojas, columnas y relaciones entre rubros e ítems e informará cada
      dato obligatorio inválido con su ubicación.
    criterio: El error señala hoja, fila y columna.
    casos_uso: [CU-02]
  - id: RF-04
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema mostrará diferencias entre totales declarados en el XLSX y totales recalculados,
      sin modificar el archivo original.
    criterio: El usuario revisa ambos totales antes de confirmar.
    casos_uso: [CU-02]
  - id: RF-05
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá confirmar rubros, unidades y agrupaciones antes de activar el
      presupuesto de una obra.
    criterio: La versión no se activa sin confirmación de estructura.
    casos_uso: [CU-03]
  - id: RF-06
    tipo: RF
    origen: Wiki + Complemento
    enunciado: >-
      El sistema conservará versiones del presupuesto y cronograma; cada modificación aprobada
      generará una versión nueva sin alterar anteriores.
    criterio: Se consulta la versión anterior y la nueva vigente.
    casos_uso: [CU-02, CU-11]
  - id: RF-07
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá registrar por período una medición oficial por ítem con cantidad,
      unidad, ejecutor propio o subcontratado y evidencia.
    criterio: El registro conserva todos esos datos y su respaldo.
    casos_uso: [CU-04]
  - id: RF-08
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá al responsable técnico aprobar o rechazar cada medición y conservar
      decisión, actor y fecha.
    criterio: La decisión queda en el historial.
    casos_uso: [CU-05]
  - id: RF-09
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema comparará la cantidad medida con el saldo del presupuesto vigente; el exceso
      quedará como propuesta pendiente y no formará parte de la medición oficial ni del
      certificado hasta que un movimiento aprobado lo cubra.
    criterio: Solo una cantidad cubierta por la versión vigente integra la medición oficial certificable.
    casos_uso: [CU-05, CU-07, CU-11]
  - id: RF-10
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema impedirá contabilizar dos veces una misma cantidad de trabajo físico aunque la
      ejecute un subcontratista.
    criterio: El acumulado físico se incrementa una sola vez.
    casos_uso: [CU-04, CU-14]
  - id: RF-11
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá cerrar un período cuando sus mediciones estén resueltas y aprobadas.
    criterio: Un período con mediciones pendientes no se cierra.
    casos_uso: [CU-06]
  - id: RF-12
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema generará el borrador de certificado con cantidades medidas y aprobadas que sean
      elegibles según el presupuesto vigente.
    criterio: El borrador excluye cantidades sin aprobación o sin saldo.
    casos_uso: [CU-07]
  - id: RF-13
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema calculará la valorización con cantidad certificable y precio de venta vigente, y
      aplicará impuestos y fondos según la configuración de la obra.
    criterio: Subtotal, impuestos y retenciones se reproducen desde su configuración.
    casos_uso: [CU-07]
  - id: RF-14
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema mostrará la cantidad medida del período, las mediciones oficiales aprobadas
      acumuladas y el saldo del presupuesto vigente; cada certificado conservará el vínculo con su
      documento financiero ERP derivado.
    criterio: El acumulado físico coincide con las mediciones aprobadas y cada factura refiere a su certificado sin duplicarlo.
    casos_uso: [CU-07, CU-10]
  - id: RF-15
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema señalará en el borrador excesos, mediciones faltantes, precios sin movimiento
      vigente y diferencias de totales con sus datos de origen.
    criterio: Cada alerta identifica rubro o ítem y su fuente.
    casos_uso: [CU-07]
  - id: RF-16
    tipo: RF
    origen: Wiki
    redefinido: true
    enunciado: >-
      El sistema permitirá corregir un certificado emitido creando una revisión nueva vinculada y
      conservando las revisiones anteriores.
    criterio: La corrección mantiene vínculo con el antecedente y no lo sobrescribe.
    casos_uso: [CU-08]
  - id: RF-17
    tipo: RF
    origen: Complemento
    redefinido: true
    enunciado: >-
      El sistema permitirá emitir el certificado de avance solo a usuarios con rol admin o miembro
      con acceso al ECMS, y registrará quién lo emitió y cuándo.
    criterio: Un visualizador no puede emitir; cada emisión identifica a su actor y su fecha.
    casos_uso: [CU-09]
  - id: RF-18
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá registrar número, fecha, destinatario y revisión del certificado, y
      exportar un archivo nuevo XLSX o PDF.
    criterio: El archivo corresponde a la revisión emitida y no sobrescribe sus fuentes.
    casos_uso: [CU-09, CU-10]
  - id: RF-19
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá proponer ampliaciones, deducciones y variaciones de precio asociadas a
      rubros o ítems, con motivo y respaldo.
    criterio: El movimiento identifica tipo, objetivo, motivo y documento.
    casos_uso: [CU-11]
  - id: RF-20
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema mostrará efecto monetario, límite, importe utilizado y saldo de cada propuesta, e
      impedirá aprobar datos incompletos o un exceso sin excepción registrada.
    criterio: Datos faltantes o exceso no autorizado impiden aprobar.
    casos_uso: [CU-11]
  - id: RF-21
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema registrará por separado las aprobaciones interna y contractual de un movimiento
      presupuestario y solo entonces actualizará la versión vigente.
    criterio: Una sola aprobación no activa la versión.
    casos_uso: [CU-11]
  - id: RF-22
    tipo: RF
    origen: Wiki
    redefinido: true
    enunciado: >-
      El sistema certificará cantidades pendientes solo después de que un movimiento aprobado las
      cubra.
    criterio: La nueva cantidad certificable usa la versión vigente que refleja el movimiento.
    casos_uso: [CU-07, CU-11]
  - id: RF-23
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá registrar en ERP el contrato legal y vincularlo con el alcance técnico,
      rubros, precios, límites, impuestos y retenciones de la obra.
    criterio: Contrato ERP y alcance ECMS permanecen relacionados.
    casos_uso: [CU-12]
  - id: RF-24
    tipo: RF
    origen: Wiki
    redefinido: true
    enunciado: >-
      El sistema permitirá al subcontratista consultar solo el estado de sus mediciones,
      certificados, valorizaciones y saldos; las mediciones de su trabajo las registra el Ingeniero
      de Obra.
    criterio: No puede registrar mediciones ni consultar otro contrato.
    casos_uso: [CU-13]
  - id: RF-25
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema valorizará el certificado de subcontratista según el contrato, registrará esa
      valorización en el control de costos de ECMS y enviará el resultado aprobado a ERP para el
      proceso de pago, sin cambiar el precio de venta al cliente.
    criterio: Costo analítico, valorización contractual, precio de venta y pago se presentan por separado.
    casos_uso: [CU-14]
  - id: RF-26
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema calculará costos por obra, rubro e ítem mediante materiales, mano de obra y
      equipos, y comparará los resultados con el presupuesto vigente, que refleja los movimientos
      aprobados.
    criterio: Cada importe identifica vía, período, fuente y naturaleza; el movimiento modifica el plan y no se registra como costo incurrido.
    casos_uso: [CU-15]
  - id: RF-27
    tipo: RF
    origen: Complemento
    enunciado: >-
      El sistema mostrará Curva S a una misma fecha de corte y separará avance físico, financiero
      y físico pendiente de movimiento presupuestario vigente.
    criterio: Las tres series comparten fecha y explican unidad y ponderación.
    casos_uso: [CU-16]
  - id: RF-28
    tipo: RF
    origen: Wiki
    enunciado: >-
      El sistema permitirá consultar presupuesto vigente, costos propios y subcontratados,
      certificaciones y saldos por obra y rubro, con acceso a cada respaldo.
    criterio: Cada cifra conduce a su registro o documento fuente.
    casos_uso: [CU-16]

  # --- No funcionales ----------------------------------------------------------
  - id: RNF-01
    tipo: RNF
    origen: Wiki
    enunciado: >-
      El sistema comprobará organización, pertenencia a la obra y rol antes de permitir leer o
      modificar información.
    criterio: Una cuenta sin permiso vigente no accede al registro.
    casos_uso: [CU-01, CU-02, CU-03, CU-04, CU-05, CU-06, CU-07, CU-08, CU-09, CU-10, CU-11, CU-12, CU-13, CU-14, CU-15, CU-16]
  - id: RNF-02
    tipo: RNF
    origen: Wiki
    enunciado: >-
      La vista del subcontratista se limitará a su contrato; no mostrará presupuestos internos,
      márgenes, salarios ni otros contratos.
    criterio: Consultas fuera del contrato se deniegan.
    casos_uso: [CU-13, CU-14]
  - id: RNF-03
    tipo: RNF
    origen: Wiki
    enunciado: >-
      Una operación interrumpida no dejará un período parcialmente cerrado ni una modificación
      activa sin las aprobaciones requeridas.
    criterio: La operación queda en estado íntegro anterior o completo.
    casos_uso: [CU-06, CU-11]
  - id: RNF-04
    tipo: RNF
    origen: Wiki
    enunciado: >-
      El sistema conservará actor, fecha, obra, versión y evidencia para cada medición, revisión,
      aprobación, emisión y cambio relevante.
    criterio: El historial permite reconstruir quién hizo qué y sobre qué versión.
    casos_uso: [CU-04, CU-05, CU-06, CU-07, CU-08, CU-09, CU-10, CU-11, CU-12, CU-13, CU-14]
  - id: RNF-05
    tipo: RNF
    origen: Wiki
    redefinido: true
    enunciado: >-
      Los certificados emitidos y las versiones que los originaron permanecerán consultables; una
      corrección crea una revisión nueva.
    criterio: La revisión anterior no se sobrescribe y la corrección queda enlazada.
    casos_uso: [CU-08, CU-09]
  - id: RNF-06
    tipo: RNF
    origen: Wiki
    enunciado: >-
      Los cálculos monetarios usarán aritmética decimal y producirán el mismo resultado para
      iguales entradas, parámetros y versiones.
    criterio: Repetir el cálculo con la misma instantánea devuelve el mismo importe.
    casos_uso: [CU-07, CU-09, CU-14, CU-15]
  - id: RNF-07
    tipo: RNF
    origen: Complemento
    enunciado: >-
      Volver a cargar el mismo XLSX sin cambios no creará otra versión de presupuesto o cronograma.
    criterio: La repetición refiere la versión existente.
    casos_uso: [CU-02]
  - id: RNF-08
    tipo: RNF
    origen: Complemento
    enunciado: >-
      Las copias de seguridad permitirán restaurar conjuntamente registros, adjuntos y versiones
      de una obra.
    criterio: La restauración recupera relaciones y archivos.
    casos_uso: [CU-02, CU-07, CU-14]
  - id: RNF-09
    tipo: RNF
    origen: Complemento
    enunciado: >-
      Los formularios de medición podrán utilizarse desde un teléfono e identificar campos
      requeridos y errores de carga.
    criterio: El escenario de medición puede completarse desde vista móvil.
    casos_uso: [CU-04]
  - id: RNF-10
    tipo: RNF
    origen: Complemento
    enunciado: >-
      Las operaciones principales podrán completarse con teclado, foco visible y mensajes de error
      identificables.
    criterio: El recorrido de teclado completa y comunica el flujo principal.
    casos_uso: [CU-02, CU-04, CU-05, CU-07]
  - id: RNF-11
    tipo: RNF
    origen: Wiki
    enunciado: >-
      Los reportes indicarán fecha de corte, unidad, moneda y procedencia de cada total.
    criterio: Ningún total carece de contexto de lectura.
    casos_uso: [CU-10, CU-15, CU-16]
  - id: RNF-12
    tipo: RNF
    origen: Wiki
    enunciado: >-
      Toda certificación o valorización consultable permitirá recuperar presupuesto, mediciones y
      documentos usados para calcularla.
    criterio: Desde el registro se llega a sus fuentes y adjuntos.
    casos_uso: [CU-07, CU-09, CU-14]

  # --- Restricciones de plataforma y alcance -----------------------------------
  - id: PR-01
    tipo: PR
    origen: Complemento
    enunciado: >-
      La primera versión será una aplicación web en español.
    criterio: Interfaz, mensajes y documentos de usuario se presentan en español.
    casos_uso: [CU-01, CU-02, CU-03, CU-04, CU-05, CU-06, CU-07, CU-08, CU-09, CU-10, CU-11, CU-12, CU-13, CU-14, CU-15, CU-16]
  - id: PR-02
    tipo: PR
    origen: Wiki
    enunciado: >-
      La solución servirá inicialmente a una constructora y respetará la organización por empresa,
      workspace o proyecto y obra de Obra Studio.
    criterio: Los datos se consultan dentro de la organización y las obras pertenecen a su agrupador.
    casos_uso: [CU-01, CU-16]
  - id: PR-03
    tipo: PR
    origen: Complemento
    enunciado: >-
      La moneda operativa inicial será guaraní paraguayo (PYG).
    criterio: Los importes se rotulan y calculan en PYG.
    casos_uso: [CU-07, CU-14, CU-15]
  - id: PR-04
    tipo: PR
    origen: Wiki + Complemento
    enunciado: >-
      El presupuesto y el cronograma podrán ingresar por XLSX; las exportaciones se generarán como
      archivos nuevos.
    criterio: El origen permanece preservado y cada exportación es independiente.
    casos_uso: [CU-02, CU-09]
  - id: PR-05
    tipo: PR
    origen: Wiki
    enunciado: >-
      La integración entre ECMS y ERP seguirá el puente y eventos definidos en Obra Studio; no se
      añadirán conectores externos fuera del alcance de módulos.
    criterio: Certificados aprobados originan registros ERP relacionados.
    casos_uso: [CU-10, CU-14]
  - id: PR-06
    tipo: PR
    origen: Wiki
    enunciado: >-
      ERP mantendrá facturas y pagos derivados de certificados aprobados; ECMS no será dueño de
      los documentos financieros ni de la ejecución de pagos.
    criterio: El documento financiero queda en ERP y refiere al certificado ECMS.
    casos_uso: [CU-10, CU-14]
  - id: PR-07
    tipo: PR
    origen: Wiki
    enunciado: >-
      El análisis de costo utilizará las vías de materiales, mano de obra y equipos de ACU y
      motor; este trabajo no desarrolla la operación completa de inventario o almacén.
    criterio: Los costos muestran sus componentes y fuente sin simular movimientos de stock fuera de alcance.
    casos_uso: [CU-15]
  - id: PR-08
    tipo: PR
    origen: Complemento
    enunciado: >-
      Toda asistencia de IA para redactar o explicar requerirá verificación y decisión humana; los
      importes procederán de reglas deterministas.
    criterio: La IA no aprueba, no registra mediciones ni fija importes oficiales.
    casos_uso: [CU-07, CU-09, CU-11]

# ------------------------------------------------------------------------------
# CASOS DE USO. detallado:true => genera especificación + clases + secuencia + actividades.
# alternativos/excepciones: paso = paso del flujo tras cuya respuesta se bifurca;
# continua:true (solo alternativos) = el camino vuelve al flujo normal; sin él, termina el caso.
# relaciones: include (base -> incluido) / extend (extensor -> base)
# ------------------------------------------------------------------------------
casos_uso:
  - id: CU-01
    nombre: Crear obra y asignar responsables
    subsistema: A
    actores: [ADM]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Administrador crea una obra dentro de su organización con sus datos identificatorios y su
      comitente, y le asigna responsables entre los miembros de la organización, cada uno con su rol.
      El sistema registra la obra con su configuración inicial y deja a cada responsable con un rol
      vigente sobre ella.
    precondiciones:
      - El actor tiene rol admin vigente en la organización.
      - Los responsables que se asignarán son miembros de la organización.
    poscondiciones:
      - La obra queda registrada en la organización con código, nombre, dirección, fechas y comitente, y con su configuración inicial.
      - Cada responsable asignado tiene un rol vigente sobre la obra desde la fecha de asignación.
    flujo:
      - { actor: ADM, accion: "Solicita crear una obra.", respuesta: "Presenta el formulario de datos identificatorios y la lista de miembros de la organización." }
      - { actor: ADM, accion: "Ingresa código, nombre, dirección, fechas de inicio y fin y comitente de la obra.", respuesta: "Comprueba que ninguna otra obra de la organización use el mismo código." }
      - { actor: ADM, accion: "Asigna los responsables y el rol de cada uno.", respuesta: "Comprueba que cada responsable sea miembro de la organización y que su rol sea uno de los roles del sistema." }
      - { actor: ADM, accion: "Confirma la creación.", respuesta: "Registra la obra con su configuración inicial en la moneda de la organización y los roles asignados, vigentes desde la fecha, y deja registro de la operación." }
    excepciones:
      - { id: E1, paso: 2, texto: "Código en uso: otra obra de la organización ya usa ese código; el sistema no registra la obra y pide un código distinto." }
      - { id: E2, paso: 3, requisito: PR-02, texto: "Responsable ajeno a la organización: el sistema rechaza la asignación, porque la obra y sus responsables pertenecen a la misma organización." }
      - { id: E3, requisito: RNF-01, texto: "El actor no tiene rol admin vigente en la organización: el sistema deniega la operación." }
  - id: CU-02
    nombre: Importar presupuesto y cronograma
    subsistema: A
    actores: [ING]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-06-01"
    modificado_por: "Taveira, Baltazar"
    fecha_modificacion: "2026-06-15"
    descripcion: >-
      El Ingeniero de Obra carga el archivo XLSX de presupuesto y cronograma de una obra. El
      sistema reconoce su estructura, contrasta los totales declarados contra los recalculados,
      informa los datos inválidos y, tras la confirmación del actor, registra una versión nueva en
      estado Propuesta, conservando el archivo original y las versiones anteriores. La activación
      de la versión corresponde a CU-03.
    precondiciones:
      - La obra existe y el actor tiene un rol vigente sobre ella.
      - El archivo contiene las hojas de presupuesto y de cronograma.
    poscondiciones:
      - Queda registrada una versión de presupuesto nueva, en estado Propuesta, con su archivo de origen y su informe de importación.
      - Las versiones anteriores permanecen consultables y sin alteración.
      - Si el archivo ya fue importado, no se crea una versión nueva.
    flujo:
      - { actor: ING, accion: "Selecciona la obra y solicita importar el presupuesto.", respuesta: "Presenta el formulario de carga y la lista de versiones registradas de la obra." }
      - { actor: ING, accion: "Adjunta el archivo XLSX de presupuesto y cronograma.", respuesta: "Calcula el hash SHA-256 del contenido y comprueba que no corresponda a una versión ya registrada." }
      - { actor: ING, accion: "Confirma la carga.", respuesta: "Identifica hojas y columnas, reconoce rubros, subrubros e ítems, conserva el archivo original sin modificarlo y recalcula los totales." }
      - { actor: ING, accion: "Revisa la estructura reconocida y la comparación de totales.", respuesta: "Muestra el total declarado y el total recalculado por rubro y general, y señala cada dato obligatorio inválido indicando hoja, fila y columna." }
      - { actor: ING, accion: "Confirma la importación.", respuesta: "Registra una versión de presupuesto nueva en estado Propuesta con su archivo de origen y su informe de importación, pendiente de activación." }
    alternativos:
      - { id: A1, paso: 2, requisito: RNF-07, texto: "Archivo ya importado: el hash coincide con una versión existente; el sistema no crea una versión nueva y refiere la versión que corresponde a ese archivo." }
      - { id: A2, paso: 4, requisito: RF-04, continua: true, texto: "Diferencia entre el total declarado y el recalculado: el sistema exige confirmación explícita; sin confirmación descarta la importación y no registra versión." }
    excepciones:
      - { id: E1, requisito: RF-03, texto: "Dato obligatorio inválido: el sistema informa hoja, fila y columna, no registra versión y permite corregir el archivo y reintentar." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la operación y registra el intento." }
      - { id: E3, texto: "Operación interrumpida: no queda una versión parcial; la obra conserva íntegra su versión vigente anterior." }
  - id: CU-03
    nombre: Confirmar estructura y activar versión vigente
    subsistema: A
    actores: [ADM]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Administrador revisa la estructura de una versión de presupuesto en estado Propuesta
      (rubros, unidades y agrupaciones), la confirma y la activa como versión vigente de la obra, o
      la descarta. Al activarla, la versión vigente anterior queda Reemplazada y consultable.
    precondiciones:
      - Existe una versión de presupuesto en estado Propuesta, registrada en CU-02.
      - El actor tiene rol admin vigente sobre la obra.
    poscondiciones:
      - La versión queda Vigente con su fecha de activación, o Descartada si el actor no confirma su estructura.
      - La versión vigente anterior, si existía, queda Reemplazada y consultable sin alteración.
    flujo:
      - { actor: ADM, accion: "Selecciona la obra y abre la versión en estado Propuesta.", respuesta: "Presenta rubros, subrubros e ítems con sus unidades y agrupaciones, junto con el informe de importación." }
      - { actor: ADM, accion: "Revisa y confirma rubros, unidades y agrupaciones.", respuesta: "Registra la confirmación de la estructura de la versión." }
      - { actor: ADM, accion: "Solicita activar la versión.", respuesta: "Deja la versión Vigente con su fecha de activación y pasa a Reemplazada la versión vigente anterior, en una sola operación." }
    alternativos:
      - { id: A1, paso: 1, requisito: RF-05, texto: "La estructura no se confirma: el actor descarta la versión; el sistema la deja Descartada y la versión vigente no cambia." }
    excepciones:
      - { id: E1, requisito: RNF-01, texto: "El actor no tiene rol admin vigente sobre la obra: el sistema deniega la activación." }
      - { id: E2, texto: "Operación interrumpida: la versión conserva el estado Propuesta y la versión vigente anterior sigue vigente." }
  - id: CU-04
    nombre: Registrar medición oficial
    subsistema: A
    actores: [ING]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Ingeniero de Obra registra, en un período abierto, la medición oficial de un ítem del
      presupuesto vigente con su cantidad, unidad, ejecutor propio o subcontratado y evidencia. El
      trabajo de un subcontratista también lo mide en terreno y lo registra el Ingeniero, con
      ejecutor subcontratado, en la misma y única medición del ítem y período.
    precondiciones:
      - La obra tiene una versión de presupuesto vigente.
      - El período de medición está Abierto.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - Queda una única medición oficial del ítem en el período, en estado Registrada, con cantidad, unidad, ejecutor, evidencia, actor, fecha y versión de presupuesto.
      - El acumulado físico del ítem no cambia hasta que la medición se apruebe en CU-05.
    flujo:
      - { actor: ING, accion: "Selecciona la obra, el período abierto y el ítem a medir.", respuesta: "Presenta el formulario de medición, apto para teléfono, con la unidad del ítem, la cantidad aprobada acumulada y el saldo de la versión vigente." }
      - { actor: ING, accion: "Ingresa la cantidad medida, indica si el ejecutor es propio o subcontratado y adjunta la evidencia.", respuesta: "Identifica los campos requeridos y comprueba que no exista otra medición del mismo ítem en el período." }
      - { actor: ING, accion: "Confirma el registro.", respuesta: "Conserva la evidencia y registra la medición en estado Registrada con actor, fecha y versión de presupuesto, pendiente de aprobación." }
    alternativos:
      - { id: A1, paso: 2, requisito: RF-10, continua: true, texto: "Medición rechazada del ítem en el período: el sistema la presenta para corregir su cantidad o su evidencia y reenviarla, sin crear una medición nueva." }
    excepciones:
      - { id: E1, paso: 2, requisito: RF-10, texto: "El ítem ya tiene una medición registrada o aprobada en el período: el sistema no crea otra, para no contabilizar dos veces el mismo trabajo físico." }
      - { id: E2, paso: 2, requisito: RNF-09, texto: "Dato requerido faltante o inválido: el sistema señala el campo con un mensaje identificable y no registra la medición hasta que se corrija." }
      - { id: E3, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega el registro." }
  - id: CU-05
    nombre: Aprobar o rechazar medición oficial
    subsistema: A
    actores: [SUP]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-06-01"
    modificado_por: "Scotover, Leandro"
    fecha_modificacion: "2026-06-15"
    descripcion: >-
      El Responsable Técnico revisa cada medición oficial registrada en el período, la contrasta
      con el saldo del presupuesto vigente y la aprueba o la rechaza. La cantidad cubierta por el
      saldo queda certificable; el exceso queda como propuesta pendiente hasta que un movimiento
      presupuestario aprobado lo cubra.
    precondiciones:
      - Existe al menos una medición oficial registrada en el período.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - Cada medición queda aprobada o rechazada, con decisión, actor, fecha y versión de presupuesto.
      - El acumulado físico del ítem se incrementa una sola vez por la cantidad aprobada.
      - La cantidad que excede el saldo queda registrada como propuesta pendiente y no es certificable.
    flujo:
      - { actor: SUP, accion: "Selecciona la obra y el período a revisar.", respuesta: "Lista las mediciones registradas con su cantidad, unidad, ejecutor propio o subcontratado y evidencia adjunta." }
      - { actor: SUP, accion: "Abre una medición y revisa su evidencia.", respuesta: "Muestra la cantidad del período, las mediciones aprobadas acumuladas y el saldo del presupuesto vigente para ese ítem." }
      - { actor: SUP, accion: "Aprueba la medición.", respuesta: "Compara la cantidad medida con el saldo de la versión vigente y determina la cantidad certificable." }
      - { actor: SUP, accion: "Confirma la decisión.", respuesta: "Registra la medición como aprobada con decisión, actor, fecha y versión, e incrementa el acumulado físico una sola vez." }
      - { actor: SUP, accion: "Repite la revisión para las mediciones restantes del período.", respuesta: "Actualiza el estado del período y habilita su cierre cuando no quedan mediciones pendientes." }
    alternativos:
      - { id: A1, paso: 3, requisito: RF-09, continua: true, texto: "La cantidad supera el saldo del presupuesto vigente: el sistema aprueba solo la parte cubierta y registra el exceso como propuesta pendiente, que no integra la medición oficial certificable hasta que un movimiento aprobado la cubra. Punto de extensión: CU-11, donde el sobrecosto se clasifica como adenda, cubierta por un movimiento presupuestario, o por otra causa (retrabajo, atraso, fallo o cambio)." }
      - { id: A2, paso: 3, requisito: RF-08, texto: "Rechazo: el actor indica el motivo; el sistema registra la medición como rechazada con decisión, actor y fecha, y la devuelve al Ingeniero de Obra." }
    excepciones:
      - { id: E1, requisito: RNF-01, texto: "El actor carece de rol vigente sobre la obra: el sistema deniega la aprobación." }
      - { id: E2, texto: "Operación interrumpida: la medición conserva íntegro su estado anterior y el período no queda parcialmente resuelto." }
  - id: CU-06
    nombre: Cerrar período de medición
    subsistema: A
    actores: [SUP]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Responsable Técnico cierra el período de medición de una obra cuando todas sus mediciones
      están resueltas y aprobadas. El cierre es atómico: el período queda cerrado por completo o
      conserva su estado anterior.
    precondiciones:
      - El período está Abierto.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - El período queda Cerrado y ya no admite mediciones nuevas; el cierre registra actor y fecha.
      - Ninguna medición del período queda pendiente de decisión.
    flujo:
      - { actor: SUP, accion: "Selecciona la obra y el período a cerrar.", respuesta: "Muestra las mediciones del período con su estado y señala las que siguen pendientes de decisión." }
      - { actor: SUP, accion: "Solicita el cierre del período.", respuesta: "Comprueba que todas las mediciones del período estén resueltas y aprobadas." }
      - { actor: SUP, accion: "Confirma el cierre.", respuesta: "Registra el período como Cerrado con actor y fecha en una sola operación." }
    excepciones:
      - { id: E1, paso: 2, requisito: RF-11, texto: "Mediciones sin aprobar: quedan mediciones registradas o rechazadas en el período; el sistema no lo cierra e indica cuáles faltan resolver." }
      - { id: E2, requisito: RNF-03, texto: "Operación interrumpida: el período no queda parcialmente cerrado y conserva su estado Abierto." }
      - { id: E3, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega el cierre." }
  - id: CU-07
    nombre: Generar borrador de certificado
    subsistema: B
    actores: [ING]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Ingeniero de Obra genera el borrador del certificado de avance de un período a partir de
      las mediciones aprobadas y elegibles según el presupuesto vigente. El sistema calcula la
      valorización con la cantidad certificable y el precio de venta vigente, aplica impuestos y
      fondos según la configuración de la obra, muestra cantidades del período, acumuladas y
      saldos, y señala las alertas del borrador.
    precondiciones:
      - Existen mediciones oficiales aprobadas en el período.
      - La obra tiene una versión de presupuesto vigente y su configuración de impuestos y fondos.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - Queda un certificado en Borrador con una revisión que conserva cantidades certificables, valorización y alertas, y el vínculo con las mediciones y la versión usadas.
      - Las cantidades sin aprobación, sin saldo o pendientes de movimiento no integran el borrador.
    flujo:
      - { actor: ING, accion: "Selecciona la obra y el período a certificar.", respuesta: "Reúne las mediciones aprobadas del período y aparta las que no tienen saldo en la versión vigente." }
      - { actor: ING, accion: "Solicita generar el borrador.", respuesta: "Crea el certificado en Borrador con una línea por ítem: cantidad certificable del período, cantidad aprobada acumulada y saldo de la versión vigente." }
      - { actor: ING, accion: "Revisa la valorización del borrador.", respuesta: "Calcula con aritmética decimal y en guaraníes el subtotal con el precio de venta vigente, los impuestos y las retenciones de los fondos según la configuración de la obra." }
      - { actor: ING, accion: "Revisa las alertas del borrador.", respuesta: "Señala excesos, mediciones faltantes, precios sin movimiento vigente y diferencias de totales, cada una con su rubro o ítem y su dato de origen." }
      - { actor: ING, accion: "Guarda el borrador.", respuesta: "Conserva la revisión con actor, fecha, versión de presupuesto y mediciones usadas, lista para su emisión en CU-09." }
    alternativos:
      - { id: A1, paso: 1, requisito: RF-22, continua: true, texto: "Cantidad pendiente ya cubierta: un movimiento presupuestario aprobado cubrió una propuesta pendiente; el sistema la incorpora como certificable según la versión vigente que refleja el movimiento." }
      - { id: A2, paso: 4, requisito: PR-08, continua: true, texto: "Asistencia de IA: el actor pide redactar o explicar una alerta; el sistema muestra la sugerencia como no verificada y los importes siguen saliendo del cálculo determinista." }
    excepciones:
      - { id: E1, paso: 1, requisito: RF-12, texto: "Sin mediciones elegibles: el período no tiene mediciones aprobadas con saldo en la versión vigente; el sistema no genera el borrador." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la generación." }
  - id: CU-08
    nombre: Corregir certificado emitido
    subsistema: B
    actores: [ING]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Ingeniero de Obra corrige un certificado emitido. El sistema crea una revisión nueva en
      Borrador vinculada a la emitida, que se conserva consultable sin alteración, y el certificado
      vuelve a Borrador hasta que se emita la revisión nueva en CU-09.
    precondiciones:
      - El certificado está Emitido.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - Existe una revisión nueva en Borrador, numerada a continuación de la anterior y vinculada a ella.
      - La revisión emitida anterior y su archivo exportado permanecen consultables sin alteración.
      - El certificado queda en Borrador hasta que se emita la revisión nueva.
    flujo:
      - { actor: ING, accion: "Abre el certificado emitido y solicita corregirlo.", respuesta: "Muestra la revisión emitida con su número, fecha, destinatario y archivo exportado." }
      - { actor: ING, accion: "Indica el motivo y corrige las cantidades o los datos.", respuesta: "Crea una revisión nueva en Borrador vinculada a la emitida y recalcula su valorización, sin modificar la revisión emitida." }
      - { actor: ING, accion: "Guarda la corrección.", respuesta: "Deja el certificado en Borrador sobre la revisión nueva, registra actor, fecha y motivo, y lo habilita para una nueva emisión." }
    excepciones:
      - { id: E1, paso: 1, requisito: RF-16, texto: "Certificado todavía en Borrador: no hay revisión emitida que corregir; el sistema no crea una revisión y remite a editar el borrador." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la corrección." }
  - id: CU-09
    nombre: Emitir certificado de avance
    subsistema: B
    actores: [ING, ADM]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-06-01"
    modificado_por: "Taveira, Baltazar"
    fecha_modificacion: "2026-06-15"
    descripcion: >-
      El Ingeniero de Obra o el Administrador emite el certificado de avance sobre una revisión en
      borrador. El sistema asigna número, fecha y destinatario, registra quién lo emitió, genera el
      archivo exportado de la revisión emitida y publica el evento que el ERP consume para reflejar
      el certificado en el avance físico-financiero de la obra y registrar su documento derivado.
    precondiciones:
      - Existe una revisión de certificado en Borrador generada a partir de mediciones aprobadas y elegibles (CU-07).
      - La configuración de impuestos y fondos de la obra está vigente.
      - El actor tiene rol admin o miembro con acceso al ECMS.
    poscondiciones:
      - El certificado queda Emitido con número, fecha, destinatario, revisión identificada y actor que lo emitió.
      - Se genera un archivo nuevo de exportación y el evento que vincula el certificado con su documento ERP.
    flujo:
      - { actor: ING, accion: "Abre la revisión en borrador del certificado.", respuesta: "Muestra las cantidades certificables, la valorización con precio de venta vigente, impuestos, fondos y las alertas del borrador." }
      - { actor: ING, accion: "Emite el certificado.", respuesta: "Asigna número y fecha, registra el destinatario y el actor que emite, y deja el certificado Emitido sobre esa revisión." }
      - { actor: ING, accion: "Solicita la exportación del certificado.", respuesta: "Genera un archivo nuevo en formato XLSX o PDF correspondiente a la revisión emitida, sin sobrescribir sus fuentes." }
      - { actor: ING, accion: "Confirma la emisión.", respuesta: "Incluye CU-10: publica el evento de certificado emitido para que el ERP lo refleje en el avance físico-financiero y registre su documento vinculado." }
    excepciones:
      - { id: E1, requisito: RF-17, texto: "El actor no tiene rol admin ni miembro con acceso al ECMS: el sistema deniega la emisión." }
      - { id: E2, requisito: RNF-06, texto: "Recálculo: repetir el cálculo con la misma instantánea de cantidades, precios y parámetros devuelve exactamente el mismo importe." }
  - id: CU-10
    nombre: Derivar documento financiero en ERP
    subsistema: B
    actores: [ECMS, ERP, TES, CLI]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      Incluido por CU-09 y CU-14. Al recibir el evento de certificado emitido que publica el Motor
      de Ingeniería, el Motor ERP registra el documento financiero derivado (factura al Cliente si
      el certificado es interno, pago al Subcontratista si es de subcontrato), lo vincula al
      certificado sin duplicarlo y lo refleja en el avance físico-financiero de la obra. Finanzas y
      Tesorería registra el cobro de la factura o aprueba y ejecuta el pago.
    precondiciones:
      - Existe un certificado Emitido cuyo evento fue publicado en CU-09 o CU-14.
      - Finanzas y Tesorería opera con rol miembro ERP vigente.
    poscondiciones:
      - Queda un documento financiero Registrado y vinculado al certificado, sin duplicarlo.
      - La factura llega a Cobrado cuando se registra el cobro; el pago llega a Pagado cuando se ejecuta.
    flujo:
      - { actor: ECMS, accion: "Publica el evento de certificado emitido.", respuesta: "Recibe el evento y comprueba que el certificado no tenga un documento financiero vinculado." }
      - { actor: ERP, accion: "Deriva el documento según el tipo de certificado.", respuesta: "Registra la factura al Cliente o el pago al Subcontratista con número, fecha y monto, vinculado al certificado, y entrega la factura al Cliente." }
      - { actor: ERP, accion: "Refleja el certificado en el avance físico-financiero.", respuesta: "Actualiza el avance de la obra con fecha de corte, unidad, moneda y procedencia de cada total." }
      - { actor: TES, accion: "Registra el cobro de la factura.", respuesta: "Deja la factura Cobrada con actor y fecha, vinculada a su certificado." }
    alternativos:
      - { id: A1, paso: 1, requisito: RF-14, texto: "Certificado ya derivado: el certificado ya tiene un documento financiero vinculado; el sistema no registra otro y refiere el existente." }
      - { id: A2, paso: 3, requisito: PR-06, texto: "Pago al subcontratista: Finanzas y Tesorería aprueba el pago y luego lo ejecuta; el sistema lo deja Aprobado y después Pagado, vinculado al certificado de subcontrato." }
    excepciones:
      - { id: E1, requisito: RNF-01, texto: "Finanzas y Tesorería no tiene rol miembro ERP vigente: el sistema deniega el registro del cobro o del pago." }
  - id: CU-11
    nombre: Proponer y aprobar movimiento presupuestario
    subsistema: A
    actores: [ADM, SUP, CLI]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      Extiende CU-05 cuando la cantidad medida excede el saldo. El Responsable Técnico clasifica la
      causa del sobrecosto y, si es una adenda, propone un movimiento presupuestario (ampliación,
      deducción o variación de precio) sobre rubros o ítems, con motivo y respaldo. El Administrador
      lo aprueba internamente y registra la aceptación contractual del Cliente; solo con ambas
      aprobaciones el sistema genera una versión de presupuesto nueva y vigente, conserva la
      anterior y deja certificables las propuestas pendientes que el movimiento cubre.
    precondiciones:
      - La obra tiene una versión de presupuesto vigente.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - El movimiento queda registrado con tipo, objetivo, motivo, respaldo, efecto monetario, límite, importe utilizado y saldo, y con cada aprobación por separado.
      - Solo con la aprobación interna y la contractual el movimiento queda Vigente; la versión de presupuesto nueva rige y la anterior queda Reemplazada y consultable.
      - Las propuestas pendientes que el movimiento cubre quedan certificables en el siguiente borrador (CU-07).
    flujo:
      - { actor: SUP, accion: "Selecciona la propuesta pendiente o el rubro o ítem y solicita proponer un movimiento.", respuesta: "Presenta los tipos ampliación, deducción y variación de precio, y el saldo vigente del objetivo." }
      - { actor: SUP, accion: "Clasifica la causa como adenda, indica tipo, objetivo, cantidad o precio y motivo, y adjunta el respaldo.", respuesta: "Calcula efecto monetario, límite, importe utilizado y saldo, y registra el movimiento como Propuesto." }
      - { actor: ADM, accion: "Revisa el movimiento propuesto.", respuesta: "Comprueba que los datos estén completos y dentro del límite." }
      - { actor: ADM, accion: "Aprueba internamente el movimiento.", respuesta: "Registra la aprobación interna con actor y fecha." }
      - { actor: ADM, accion: "Informa la respuesta contractual del Cliente y adjunta su respaldo.", respuesta: "Conserva el respaldo y pide confirmar la aceptación contractual, que se registra por separado de la aprobación interna." }
      - { actor: ADM, accion: "Confirma la aceptación contractual y solicita activar el movimiento.", respuesta: "Registra la aprobación contractual y, en una sola operación, genera la versión de presupuesto nueva que refleja el movimiento, la deja Vigente, pasa la anterior a Reemplazada y marca cubiertas las propuestas pendientes alcanzadas." }
    alternativos:
      - { id: A1, paso: 1, requisito: RF-09, texto: "Sobrecosto por otra causa: el actor clasifica la propuesta pendiente como retrabajo, atraso, fallo o cambio; no se propone movimiento y el excedente no se certifica." }
      - { id: A2, paso: 3, texto: "Rechazo interno: el Administrador rechaza el movimiento con su motivo; el sistema lo deja Rechazado y el presupuesto vigente no cambia." }
      - { id: A3, paso: 5, requisito: RF-21, texto: "El Cliente no acepta: el Administrador registra el rechazo contractual; el sistema deja el movimiento Rechazado y el presupuesto vigente no cambia." }
    excepciones:
      - { id: E1, paso: 3, requisito: RF-20, texto: "Datos incompletos o exceso sobre el límite sin excepción registrada: el sistema impide la aprobación interna e indica qué falta." }
      - { id: E2, requisito: RNF-03, texto: "Operación interrumpida: no queda una versión nueva activa sin las dos aprobaciones; el presupuesto vigente conserva su estado anterior." }
      - { id: E3, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la operación." }
  - id: CU-12
    nombre: Registrar contrato de subcontrato
    subsistema: B
    actores: [ADM]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Administrador registra el contrato de un subcontratista de la obra. El contrato legal se
      registra en el ERP, que es su dueño, y el sistema lo vincula en el ECMS con el alcance técnico
      de la obra: rubros, precios, límites, impuestos y retenciones.
    precondiciones:
      - La obra tiene una versión de presupuesto vigente con los rubros y precios que abarca el contrato.
      - El subcontratista está registrado como socio de la organización.
      - El actor tiene rol admin vigente sobre la obra.
    poscondiciones:
      - El subcontrato queda registrado con número, monto, modalidad y estado, vinculado a la obra, al socio y a su alcance técnico.
      - El contrato legal queda registrado en el ERP y relacionado con el subcontrato del ECMS.
    flujo:
      - { actor: ADM, accion: "Selecciona la obra y solicita registrar un subcontrato.", respuesta: "Presenta los socios de la organización y los rubros e ítems de la versión vigente." }
      - { actor: ADM, accion: "Elige el socio e indica número, monto, modalidad, rubros alcanzados, precios, límites, impuestos y retenciones.", respuesta: "Comprueba que los rubros pertenezcan a la versión vigente y que el número no esté registrado en la obra." }
      - { actor: ADM, accion: "Confirma el registro.", respuesta: "Registra el subcontrato vinculado a su alcance técnico y publica el evento para que el ERP registre el contrato legal." }
    excepciones:
      - { id: E1, paso: 2, requisito: RF-23, texto: "Rubro ajeno a la versión vigente o número repetido: el sistema no registra el subcontrato e indica el dato a corregir." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene rol admin vigente sobre la obra: el sistema deniega el registro." }
  - id: CU-13
    nombre: Consultar estado del subcontrato
    subsistema: B
    actores: [SUB]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Subcontratista consulta el estado de su contrato: las mediciones de su trabajo, los
      certificados de subcontrato con sus valorizaciones y los saldos. La vista se limita a su
      contrato y no muestra presupuestos internos, márgenes, salarios ni otros contratos.
    precondiciones:
      - El actor accede como subcontratista a un contrato de subcontrato registrado.
    poscondiciones:
      - El actor ve solo los datos de su contrato.
      - No se modifica ningún registro.
    flujo:
      - { actor: SUB, accion: "Ingresa y selecciona su contrato.", respuesta: "Comprueba que el contrato pertenezca al socio del actor y presenta su número, monto, modalidad y estado." }
      - { actor: SUB, accion: "Consulta las mediciones de su trabajo.", respuesta: "Lista las mediciones del contrato con ejecutor subcontratado, con cantidad, período y estado." }
      - { actor: SUB, accion: "Consulta los certificados y las valorizaciones.", respuesta: "Muestra los certificados de subcontrato con su valorización, el monto certificado y el saldo certificable." }
    excepciones:
      - { id: E1, paso: 1, requisito: RNF-02, texto: "Contrato ajeno: el contrato no pertenece al socio del actor; el sistema deniega la consulta y registra el intento." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene acceso vigente: el sistema deniega la consulta." }
  - id: CU-14
    nombre: Certificar y valorizar subcontrato
    subsistema: B
    actores: [SUP, SUB, ERP]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      Incluye CU-10. El Responsable Técnico certifica el trabajo de un subcontratista a partir de
      las mediciones aprobadas con ejecutor subcontratado. El sistema valoriza el certificado de
      subcontrato con los precios del contrato, registra esa valorización en el control de costos
      del ECMS sin cambiar el precio de venta al cliente, lo emite y lo envía al ERP para el proceso
      de pago. El Subcontratista ve el certificado emitido de su contrato.
    precondiciones:
      - El subcontrato está registrado (CU-12).
      - Existen mediciones aprobadas con ejecutor subcontratado dentro del alcance del contrato.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - Queda un certificado de subcontrato Emitido con su valorización contractual, presentada por separado del costo analítico y del precio de venta.
      - El evento de certificado emitido queda publicado para que el ERP registre el pago (CU-10).
      - El acumulado físico del ítem no cambia: la medición ya se contó una sola vez al aprobarse en CU-05.
    flujo:
      - { actor: SUP, accion: "Selecciona el subcontrato y el período.", respuesta: "Reúne las mediciones aprobadas del período con ejecutor subcontratado dentro del alcance del contrato." }
      - { actor: SUP, accion: "Solicita la valorización del certificado.", respuesta: "Valoriza cada cantidad con el precio del contrato, en guaraníes y con aritmética decimal, aplica las retenciones del contrato y presenta por separado costo analítico, valorización contractual, precio de venta y pago." }
      - { actor: SUP, accion: "Emite el certificado de subcontrato.", respuesta: "Registra el certificado de subcontrato Emitido con número, fecha y actor, y su valorización en el control de costos del ECMS." }
      - { actor: SUP, accion: "Confirma el envío al ERP.", respuesta: "Incluye CU-10: publica el evento de certificado emitido para que el ERP registre el pago al subcontratista." }
      - { actor: SUB, accion: "Consulta el certificado emitido de su contrato.", respuesta: "Muestra la valorización de su contrato sin precios de venta, márgenes ni datos de otros contratos." }
    alternativos:
      - { id: A1, paso: 1, requisito: RF-10, continua: true, texto: "Medición ya certificada: la medición integra otro certificado de subcontrato; el sistema la excluye para no valorizar dos veces el mismo trabajo físico." }
    excepciones:
      - { id: E1, paso: 1, texto: "Sin mediciones del subcontrato: no hay mediciones aprobadas con ejecutor subcontratado en el período; el sistema no genera el certificado." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la certificación." }
  - id: CU-15
    nombre: Calcular costos por vía
    subsistema: A
    actores: [ING, ECMS]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Ingeniero de Obra solicita el costo de la obra por rubro e ítem. El Motor de Ingeniería
      calcula el costo de cada ítem por las vías de materiales, mano de obra y equipos a partir de
      su análisis de costo unitario y lo compara con el presupuesto vigente, que ya refleja los
      movimientos aprobados. Cada importe identifica vía, período, fuente y naturaleza.
    precondiciones:
      - La obra tiene una versión de presupuesto vigente con análisis de costo unitario en sus ítems.
      - El actor tiene un rol vigente sobre la obra.
    poscondiciones:
      - El costo por obra, rubro e ítem queda desagregado por vía y comparado con el presupuesto vigente, con fecha de corte, unidad y moneda.
      - Ningún movimiento presupuestario se registra como costo incurrido.
    flujo:
      - { actor: ING, accion: "Selecciona la obra y la fecha de corte y solicita el análisis de costos.", respuesta: "Obtiene la versión de presupuesto vigente y los análisis de costo unitario de sus ítems." }
      - { actor: ECMS, accion: "Calcula el costo de cada ítem por las vías de materiales, mano de obra y equipos.", respuesta: "Suma los componentes de cada análisis con aritmética decimal, en guaraníes, y agrega los importes por ítem, rubro y obra." }
      - { actor: ING, accion: "Revisa la comparación con el presupuesto vigente.", respuesta: "Muestra cada importe con su vía, período, fuente y naturaleza junto al importe presupuestado, con fecha de corte, unidad y moneda." }
    alternativos:
      - { id: A1, paso: 1, requisito: RF-26, continua: true, texto: "Ítem sin análisis de costo unitario: el sistema lo informa como ítem sin costo calculado y continúa con los demás." }
    excepciones:
      - { id: E1, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la consulta." }
  - id: CU-16
    nombre: Consultar reportes y Curva S
    subsistema: B
    actores: [ADM, SUP]
    detallado: true
    creado_por: "Rojas, Sebastián"
    fecha_creacion: "2026-10-22"
    modificado_por: "Rojas, Sebastián"
    fecha_modificacion: "2026-10-22"
    descripcion: >-
      El Administrador o el Responsable Técnico consulta los reportes de la obra: la Curva S a una
      fecha de corte, con avance físico, avance financiero y avance físico pendiente de movimiento
      presupuestario vigente, y el resumen de presupuesto vigente, costos propios y subcontratados,
      certificaciones y saldos por obra y rubro, con acceso al respaldo de cada cifra.
    precondiciones:
      - El actor tiene un rol vigente sobre una obra de su organización.
    poscondiciones:
      - Cada total se presenta con fecha de corte, unidad, moneda y procedencia, y conduce a su registro o documento fuente.
      - No se modifica ningún registro.
    flujo:
      - { actor: ADM, accion: "Selecciona la obra y la fecha de corte.", respuesta: "Comprueba que la obra pertenezca a la organización del actor." }
      - { actor: ADM, accion: "Solicita la Curva S.", respuesta: "Calcula a la misma fecha de corte las series de avance físico, avance financiero y físico pendiente de movimiento vigente, y explica unidad y ponderación." }
      - { actor: ADM, accion: "Solicita el resumen por rubro.", respuesta: "Muestra presupuesto vigente, costos propios y subcontratados, certificaciones y saldos por obra y rubro, cada total con fecha de corte, unidad, moneda y procedencia." }
      - { actor: ADM, accion: "Selecciona una cifra.", respuesta: "Presenta el registro o el documento fuente que la respalda." }
    excepciones:
      - { id: E1, paso: 1, requisito: PR-02, texto: "Obra de otra organización: la obra no pertenece a la organización del actor; el sistema no muestra sus datos." }
      - { id: E2, requisito: RNF-01, texto: "El actor no tiene rol vigente sobre la obra: el sistema deniega la consulta." }

subsistemas:
  A: { nombre: "Presupuesto y Medición", descripcion: "Plan de la obra, su versionado y la medición física del avance." }
  B: { nombre: "Certificación y Subcontratos", descripcion: "Valorización del avance medido, su emisión y la derivación al ERP." }

relaciones_cu:
  - { origen: CU-09, destino: CU-10, tipo: include }
  - { origen: CU-14, destino: CU-10, tipo: include }
  - { origen: CU-11, destino: CU-05, tipo: extend }

# ------------------------------------------------------------------------------
# ENTIDADES. Fuente del diagrama de clases del CU, de clases persistentes y del DER.
# id: estable, lo que referencia el resto del modelo. nombre: visible, se cambia en un solo lugar.
# derivado:true  -> se marca "/" en UML y NO se genera columna en el DER (L2-16 del wiki).
# tabla: ausente -> la clase no persiste (objeto de valor).
# ------------------------------------------------------------------------------
entidades:
  - id: organizacion
    nombre: Organizacion
    conceptual: true
    paquete: Organización y seguridad
    tabla: organizacion
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: nombre, t: String, sql: "VARCHAR(160)" }
      - { n: pais, t: String, sql: "CHAR(2)" }
      - { n: moneda, t: String, sql: "CHAR(3)" }
  - id: usuario
    nombre: Usuario
    conceptual: true
    paquete: Organización y seguridad
    tabla: usuario
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: nombre, t: String, sql: "VARCHAR(160)" }
      - { n: email, t: String, sql: "VARCHAR(254)" }
  - id: rol_asignado
    nombre: RolAsignado
    paquete: Organización y seguridad
    tabla: rol_asignado
    clase_asociativa: true
    pk_compuesta: [usuario_id, obra_id]
    atributos:
      - { n: rol, t: String, sql: "VARCHAR(40)" }
      - { n: vigenteDesde, t: Date, sql: "DATE" }
  - id: cliente
    nombre: Cliente
    conceptual: true
    paquete: Partes
    tabla: cliente
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: formaLegal, t: String, sql: "VARCHAR(10)" }
      - { n: identificador, t: String, sql: "VARCHAR(30)" }
      - { n: nombre, t: String, sql: "VARCHAR(160)" }
  - id: socio
    nombre: Socio
    conceptual: true
    paquete: Partes
    tabla: socio
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: formaLegal, t: String, sql: "VARCHAR(10)" }
      - { n: identificador, t: String, sql: "VARCHAR(30)" }
      - { n: nombre, t: String, sql: "VARCHAR(160)" }
  - id: obra
    nombre: Obra
    conceptual: true
    paquete: Obra y configuración
    tabla: obra
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: codigo, t: String, sql: "VARCHAR(30)" }
      - { n: nombre, t: String, sql: "VARCHAR(160)" }
      - { n: direccion, t: String, sql: "VARCHAR(240)", null: true }
      - { n: estado, t: String, sql: "VARCHAR(20)" }
      - { n: fechaInicio, t: Date, sql: "DATE", null: true }
      - { n: fechaFin, t: Date, sql: "DATE", null: true }
  - id: configuracion_obra
    nombre: ConfiguracionObra
    paquete: Obra y configuración
    tabla: configuracion_obra
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: tasaIVA, t: Decimal, sql: "NUMERIC(5,2)" }
      - { n: moneda, t: String, sql: "CHAR(3)" }
      - { n: toleranciaDesvio, t: Decimal, sql: "NUMERIC(5,2)" }
  - id: fondo_retencion
    nombre: FondoRetencion
    conceptual: true
    paquete: Obra y configuración
    tabla: fondo_retencion
    atributos:
      - { n: id, t: UUID, sql: "UUID", pk: true }
      - { n: nombre, t: String, sql: "VARCHAR(80)" }
      - { n: porcentaje, t: Decimal, sql: "NUMERIC(5,2)" }
