# ------------------------------------------------------------------------------
# DECISIONES DE MODELADO. Discrepancias halladas entre el catálogo de
# requerimientos y la documentación de dominio, con su resolución.
# ------------------------------------------------------------------------------
decisiones:
  - id: D-01
    tema: Términos ausentes en la documentación de dominio
    hallazgo: >-
      «Valorización» y «Curva S» no aparecen en ninguna versión de la documentación de Obra Studio.
    resolucion: >-
      Se conservan como requisitos (RF-13, RF-25 y RF-27) y se declaran en la tabla de vocabulario
      como alcance que extiende el dominio documentado. Valorización designa el importe calculado
      del certificado; Curva S es un reporte derivado que no agrega tabla propia.
  - id: D-02
    tema: Aditivos y deductivos
    hallazgo: >-
      El catálogo habla de aditivos y deductivos; la documentación de dominio no usa esos términos.
    resolucion: >-
      Se unifican en {movimiento_presupuestario} con tipo AMPLIACION, DEDUCCION o VARIACION_PRECIO,
      que es el vocabulario del dominio.
  - id: D-03
    tema: Rol de responsable técnico
    hallazgo: >-
      El catálogo nombra un «responsable técnico» que no existe como rol en el dominio.
    resolucion: >-
      Se asimila al Supervisor de la obra: es el actor que aprueba o rechaza las mediciones y cierra
      el período. Es un actor, no un rol: en el sistema opera como miembro o admin (D-08).
  - id: D-04
    tema: Idempotencia de la importación
    hallazgo: >-
      RNF-07 exige que recargar el mismo XLSX no cree otra versión, pero la implementación actual
      calcula el hash sobre el documento ya confirmado y no sobre el archivo.
    resolucion: >-
      {archivo_origen} declara hashSHA256 sobre el contenido del archivo y la importación lo consulta
      antes de crear una versión, de modo que el requisito se cumple tal como está enunciado.
  - id: D-05
    tema: Doble conteo de trabajo físico
    hallazgo: >-
      RF-10 exige impedir que una misma cantidad se contabilice dos veces, sin indicar el mecanismo.
    resolucion: >-
      Existe una sola {medicion_oficial} por ítem y período, con el ejecutor como atributo en lugar de
      un registro separado para el subcontratista. El acumulado se incrementa una sola vez por
      construcción del modelo, no por una validación añadida.
  - id: D-06
    tema: Estados del movimiento presupuestario
    hallazgo: >-
      RF-21 exige aprobación interna y contractual separadas; el dominio no define estados para el
      movimiento.
    resolucion: >-
      Se diseña el ciclo Propuesto, AprobadoInterno, AprobadoContractual y Vigente, más Rechazado.
      Solo la transición a Vigente genera una versión de presupuesto nueva.
  - id: D-07
    tema: Estados del certificado
    hallazgo: >-
      La documentación describe el certificado con tres, cuatro y cinco estados según el documento,
      y trata el rechazo unas veces como estado y otras como transición. El modelo anterior además
      cerraba el certificado al cerrar el período, aunque la emisión exigía el período ya cerrado.
    resolucion: >-
      El certificado es un registro de avance, no un trámite: tiene dos estados, Borrador y Emitido,
      y no se cierra por período. Corregir un certificado emitido crea una revisión nueva en
      Borrador vinculada a la anterior, que se conserva. Su tipo es interno o subcontrato:
      los ítems de una adenda se certifican dentro del mismo certificado de avance (D-17). El interno
      se refleja en el avance físico-financiero de la obra y origina la factura al cliente.
  - id: D-08
    tema: Modelo de permisos
    hallazgo: >-
      Una parte de la documentación define una matriz de roles y otra afirma que la aplicación no
      debe definir ningún rol.
    resolucion: >-
      Se adopta un conjunto mínimo de roles, porque RNF-01 exige comprobar el rol: admin, miembro y
      visualizador, más miembro ERP (contadores) y miembro ECMS (asistente o fiscalizador de campo).
      Un actor no es un rol: el Ingeniero de Obra opera como miembro, el Responsable Técnico como
      miembro o admin, el Administrador (gerente) como admin, un auditor como visualizador y
      Finanzas y Tesorería como miembro ERP. El Subcontratista accede solo a su contrato (RNF-02).
      No se impone separación de funciones entre roles.
  - id: D-09
    tema: Propiedad del contrato de subcontrato
    hallazgo: >-
      Un documento asigna el contrato al ERP y otro al ECMS.
    resolucion: >-
      Se aplica la regla de propiedad por naturaleza del registro: el hecho de campo pertenece al
      ECMS y el documento legal al ERP. El contrato es del ERP; el certificado, del ECMS.
  - id: D-10
    tema: Persistencia del árbol de presupuesto
    hallazgo: >-
      La implementación guarda el presupuesto como documento JSON y no como tablas normalizadas.
    resolucion: >-
      El diagrama de entidad relación presenta el modelo normalizado, que es lo que corresponde al
      modelo de diseño. El almacenamiento documental se documenta como decisión de implementación y
      no altera el modelo conceptual.
  - id: D-11
    tema: Atributos derivados
    hallazgo: >-
      Importes como el acumulado certificado o el saldo podrían almacenarse y quedar desfasados.
    resolucion: >-
      Se marcan como derivados en el diagrama de clases y se omiten como columnas en el diagrama de
      entidad relación: se calculan desde los registros aprobados y no pueden discrepar de su origen.
  - id: D-12
    tema: Alcance del trabajo
    hallazgo: >-
      Obra Studio no tiene ningún módulo de taller ni de fabricación, ni en la documentación ni en
      el catálogo de módulos de la implementación.
    resolucion: >-
      No hay nada que excluir por ese concepto. El alcance se acota explícitamente a seis módulos y
      se declaran los excluidos con su motivo.
  - id: D-13
    tema: Activación de la versión de presupuesto
    hallazgo: >-
      CU-03 figuraba con el Administrador, pero CU-02 lo incluía y su flujo hacía que el Ingeniero de
      Obra solicitara la activación.
    resolucion: >-
      Se separan: CU-02 termina con la versión en Propuesta y CU-03, del Administrador, confirma la
      estructura (RF-05) y la activa o la descarta. Se quita el include CU-02 → CU-03, porque
      activar es una meta propia del Administrador y no un paso común de varios casos.
  - id: D-14
    tema: Relaciones entre casos de uso de certificación
    hallazgo: >-
      CU-09 incluía CU-07 aunque su precondición exige que el borrador ya exista, y CU-08 extendía
      CU-09 aunque la corrección ocurre después de la emisión.
    resolucion: >-
      Se quitan ambas relaciones: generar el borrador (CU-07) y corregir un emitido (CU-08) son
      metas propias que preceden o siguen a la emisión. Se mantienen CU-09 y CU-14 incluyendo CU-10
      (subobjetivo común sin actor humano propio) y CU-11 extendiendo CU-05 en el exceso sobre saldo.
  - id: D-15
    tema: Motores ECMS y ERP como actores
    hallazgo: >-
      El modelo de casos de uso declara al Motor de Ingeniería (CU-10, CU-15) y al Motor ERP (CU-10,
      CU-14) como actores sistema, mientras las vistas C4 los ubican como contenedores de Obra Studio.
    resolucion: >-
      Se mantienen como actores de tipo sistema, marcados interno, para representar los procesos que
      cada motor ejecuta sin intervención de un usuario: el cálculo por vía, la publicación del
      evento y la derivación de facturas y pagos. La vista C4 describe la estructura y no los
      objetivos, por eso los ubica dentro del sistema.
  - id: D-16
    tema: Requisitos redefinidos respecto del catálogo
    hallazgo: >-
      RF-16, RF-17, RF-22 y RNF-05 suponían un certificado con revisión por dos personas, cierre y
      reapertura autorizada; las excepciones de CU-09 citaban RNF-06 sin que el catálogo lo marcara;
      RF-24 hacía que el subcontratista presentara mediciones que mide y carga el Ingeniero de Obra.
    resolucion: >-
      Se redefinen RF-16, RF-17, RF-22 y RNF-05 para el certificado de dos estados y los roles mínimos (D-07, D-08):
      RF-16 corrige mediante revisión nueva, RF-17 limita quién emite, RF-22 conserva solo la
      certificación de pendientes cubiertos y RNF-05 habla de certificados emitidos. RNF-06 se
      marca en CU-09, que calcula la valorización. RF-24 queda como consulta del subcontratista y
      RNF-09 deja de marcarse en CU-13, que ya no tiene formulario de medición (D-18).
  - id: D-17
    tema: Adendas y facturación al cliente
    hallazgo: >-
      No estaba definido cómo se certifica una adenda ni desde qué certificado factura el ERP al
      cliente. Una adenda no siempre es un pedido del cliente: el exceso medido puede deberse a un
      retrabajo, un atraso, un fallo o un cambio.
    resolucion: >-
      La adenda no tiene certificado propio: sus ítems se miden como cualquier otro y se certifican
      en el mismo certificado de avance, validados contra el presupuesto vigente (presupuesto más
      movimientos). El exceso sobre el saldo se detecta en CU-05 como sobrecosto
      ({propuesta_pendiente}) y en CU-11 se clasifica por causa: adenda, cubierta por un
      {movimiento_presupuestario}, o retrabajo, atraso, fallo o cambio. El ERP factura al cliente a
      partir del certificado interno.
  - id: D-18
    tema: Medición del trabajo subcontratado
    hallazgo: >-
      CU-13 hacía que el Subcontratista presentara mediciones, mientras D-05 establece una sola
      {medicion_oficial} por ítem y período, con el ejecutor como atributo.
    resolucion: >-
      El Ingeniero de Obra mide en terreno lo ejecutado por el subcontratista y lo registra en CU-04
      con ejecutor subcontratado. CU-13 pasa a «Consultar estado del subcontrato» y RF-24 se
      redefine como consulta (D-16).
  - id: D-19
    tema: Facturas y pagos dentro del sistema
    hallazgo: >-
      El alcance incluía los módulos erp.invoices y erp.payments, pero las vistas C4 y el catálogo
      de actores trataban al ERP como sistema externo.
    resolucion: >-
      Facturas y pagos son parte de Obra Studio: el ERP es un contenedor del sistema (Motor ERP) y
      se modela el ciclo del {documento_financiero_erp}: Registrado, y luego Cobrado si es factura o
      Aprobado y Pagado si es pago, a cargo de Finanzas y Tesorería en CU-10.
  - id: D-20
    tema: Generalización de actores
    hallazgo: >-
      La plantilla pide un diagrama de generalización de actores, pero el modelo no declaraba
      jerarquía. Un actor hijo hereda todos los casos de uso del padre, de modo que una jerarquía
      con casos propios del padre daría a cada hijo metas que no tiene.
    resolucion: >-
      Se declaran dos padres abstractos sin casos de uso propios: Usuario de Obra, que agrupa al
      Ingeniero de Obra, al Responsable Técnico y al Administrador por el acceso común de RNF-01, y
      Motor de Obra Studio, que agrupa a los dos motores que actúan sin usuario (D-15). Subcontratista,
      Cliente y Finanzas y Tesorería no generalizan: su acceso es distinto (RNF-02, PR-06).
  - id: D-21
    tema: Estados del período de medición
    hallazgo: >-
      RF-11 y RNF-03 hablan de cerrar el período y de no dejarlo parcialmente cerrado, y la entidad
      declara el atributo estado, pero el modelo no tenía su máquina de estados; CU-04 y CU-06 la
      necesitan en sus precondiciones.
    resolucion: >-
      Se declara el ciclo Abierto y Cerrado: el cierre ocurre en CU-06 con todas las mediciones
      aprobadas y es atómico. Ningún caso de uso abre períodos; su apertura queda fuera del alcance
      del catálogo.

