# ------------------------------------------------------------------------------
# CLASES POR CASO DE USO (Clean Architecture proyectada en estereotipos Jacobson).
# ------------------------------------------------------------------------------
clases_cu:
  CU-01:
    boundary: [crear_obra_controlador, obra_presentador]
    control:  [crear_obra_interactor]
    entity:   [obra, configuracion_obra, rol_asignado, usuario, organizacion, cliente]
    puertos:  [i_obra_repositorio, i_usuario_repositorio, i_auditoria_repositorio]
  CU-02:
    boundary: [importar_presupuesto_controlador, importacion_presentador]
    control:  [importar_presupuesto_interactor, validar_estructura_servicio, contrastar_totales_servicio]
    entity:   [obra, presupuesto, version_presupuesto, linea_presupuesto, archivo_origen, informe_importacion]
    puertos:  [i_presupuesto_repositorio, i_almacen_archivos, i_lector_planilla, i_auditoria_repositorio]
  CU-03:
    boundary: [activar_version_controlador, version_presentador]
    control:  [activar_version_interactor]
    entity:   [version_presupuesto, presupuesto, linea_presupuesto, informe_importacion]
    puertos:  [i_presupuesto_repositorio, i_auditoria_repositorio, i_reloj]
  CU-04:
    boundary: [registrar_medicion_controlador, medicion_presentador]
    control:  [registrar_medicion_interactor]
    entity:   [medicion_oficial, evidencia, periodo, linea_presupuesto, version_presupuesto]
    puertos:  [i_medicion_repositorio, i_presupuesto_repositorio, i_almacen_archivos, i_auditoria_repositorio]
  CU-05:
    boundary: [aprobar_medicion_controlador, medicion_presentador]
    control:  [aprobar_medicion_interactor, evaluar_saldo_servicio]
    entity:   [periodo, medicion_oficial, evidencia, linea_presupuesto, version_presupuesto, propuesta_pendiente]
    puertos:  [i_medicion_repositorio, i_presupuesto_repositorio, i_auditoria_repositorio, i_reloj]
  CU-06:
    boundary: [cerrar_periodo_controlador, periodo_presentador]
    control:  [cerrar_periodo_interactor]
    entity:   [periodo, medicion_oficial]
    puertos:  [i_medicion_repositorio, i_auditoria_repositorio, i_reloj]
  CU-07:
    boundary: [generar_borrador_controlador, certificado_presentador]
    control:  [generar_borrador_interactor, calcular_valorizacion_servicio, detectar_alertas_servicio]
    entity:   [certificado, revision_certificado, linea_certificado, medicion_oficial, linea_presupuesto, configuracion_obra, valorizacion]
    puertos:  [i_medicion_repositorio, i_presupuesto_repositorio, i_certificado_repositorio, i_auditoria_repositorio]
  CU-08:
    boundary: [corregir_certificado_controlador, certificado_presentador]
    control:  [corregir_certificado_interactor, calcular_valorizacion_servicio]
    entity:   [certificado, revision_certificado, linea_certificado, valorizacion]
    puertos:  [i_certificado_repositorio, i_auditoria_repositorio]
  CU-09:
    boundary: [emitir_certificado_controlador, certificado_presentador]
    control:  [emitir_certificado_interactor, calcular_valorizacion_servicio]
    entity:   [certificado, revision_certificado, linea_certificado, retencion_aplicada, configuracion_obra, fondo_retencion, valorizacion]
    puertos:  [i_certificado_repositorio, i_generador_documento, i_publicador_eventos, i_auditoria_repositorio, i_reloj]
  CU-10:
    boundary: [documento_financiero_controlador, documento_financiero_presentador]
    control:  [derivar_documento_interactor]
    entity:   [documento_financiero_erp, certificado]
    puertos:  [i_documento_financiero_repositorio, i_auditoria_repositorio]
  CU-11:
    boundary: [movimiento_controlador, movimiento_presentador]
    control:  [movimiento_interactor, evaluar_limite_servicio]
    entity:   [movimiento_presupuestario, aprobacion, propuesta_pendiente, linea_presupuesto, version_presupuesto]
    puertos:  [i_movimiento_repositorio, i_presupuesto_repositorio, i_almacen_archivos, i_auditoria_repositorio]
  CU-12:
    boundary: [registrar_subcontrato_controlador, subcontrato_presentador]
    control:  [registrar_subcontrato_interactor]
    entity:   [subcontrato, socio, obra]
    puertos:  [i_subcontrato_repositorio, i_presupuesto_repositorio, i_publicador_eventos, i_auditoria_repositorio]
  CU-13:
    boundary: [consultar_subcontrato_controlador, subcontrato_presentador]
    control:  [consultar_subcontrato_interactor]
    entity:   [subcontrato, socio, certificado, medicion_oficial, valorizacion]
    puertos:  [i_subcontrato_repositorio, i_medicion_repositorio, i_certificado_repositorio, i_auditoria_repositorio]
  CU-14:
    boundary: [certificar_subcontrato_controlador, certificado_presentador]
    control:  [certificar_subcontrato_interactor, calcular_valorizacion_servicio]
    entity:   [certificado, revision_certificado, linea_certificado, retencion_aplicada, subcontrato, medicion_oficial, valorizacion]
    puertos:  [i_subcontrato_repositorio, i_medicion_repositorio, i_certificado_repositorio, i_publicador_eventos, i_auditoria_repositorio]
  CU-15:
    boundary: [calcular_costos_controlador, costos_presentador]
    control:  [calcular_costos_interactor, calcular_costo_via_servicio]
    entity:   [analisis_costo_unitario, componente_acu, linea_presupuesto, version_presupuesto, obra]
    puertos:  [i_presupuesto_repositorio]
  CU-16:
    boundary: [consultar_reportes_controlador, reporte_presentador]
    control:  [consultar_reportes_interactor, generar_curva_s_servicio]
    entity:   [version_presupuesto, linea_presupuesto, periodo, linea_certificado, obra]
    puertos:  [i_consulta_reportes, i_presupuesto_repositorio]

# ------------------------------------------------------------------------------
# MÁQUINAS DE ESTADO. Única declaración: prosa y diagramas leen de aquí.
# creado_en: casos de uso que crean la entidad en su estado inicial.
# cu (en cada transición): caso o casos de uso que la disparan; ninguna transición queda sin caso.
# ------------------------------------------------------------------------------
estados:
  version_presupuesto:
    inicial: Propuesta
    creado_en: [CU-02, CU-11]
    finales: [Reemplazada, Descartada]
    estados:
      - { n: Propuesta,   d: "Importada y registrada; espera la confirmación de estructura y la activación." }
      - { n: Vigente,     d: "Rige para medición, certificación y control de saldo." }
      - { n: Reemplazada, d: "Un movimiento aprobado generó una versión posterior; permanece consultable." }
      - { n: Descartada,  d: "El Administrador no confirmó su estructura; no llegó a regir." }
    transiciones:
      - { de: Propuesta, a: Vigente, evento: "confirmar estructura y activar", guarda: "estructura confirmada", cu: [CU-03, CU-11] }
      - { de: Propuesta, a: Descartada, evento: "descartar", cu: CU-03 }
      - { de: Vigente, a: Reemplazada, evento: "activar versión posterior", cu: [CU-03, CU-11] }
  medicion_oficial:
    inicial: Registrada
    creado_en: [CU-04]
    finales: [Aprobada]
    estados:
      - { n: Registrada, d: "Cargada por el Ingeniero de Obra con su evidencia; espera decisión." }
      - { n: Aprobada,   d: "El Responsable Técnico la validó; su cantidad cubierta es certificable." }
      - { n: Rechazada,  d: "Devuelta con motivo; no integra el acumulado físico." }
    transiciones:
      - { de: Registrada, a: Aprobada, evento: "aprobar", cu: CU-05 }
      - { de: Registrada, a: Rechazada, evento: "rechazar", guarda: "motivo informado", cu: CU-05 }
      - { de: Rechazada, a: Registrada, evento: "corregir y reenviar", cu: CU-04 }
  certificado:
    inicial: Borrador
    creado_en: [CU-07, CU-14]
    finales: [Emitido]
    estados:
      - { n: Borrador, d: "En preparación o corrección; todavía no se emitió. Editable." }
      - { n: Emitido,  d: "Con número, fecha y actor; visible en el avance físico-financiero de la obra y publicado al ERP." }
    transiciones:
      - { de: Borrador, a: Emitido, evento: "emitir", cu: [CU-09, CU-14] }
      - { de: Emitido, a: Borrador, evento: "corregir / crea revisión nueva y conserva la anterior", cu: CU-08 }
  movimiento_presupuestario:
    inicial: Propuesto
    creado_en: [CU-11]
    finales: [Vigente, Rechazado]
    estados:
      - { n: Propuesto,            d: "Registrado con tipo, objetivo, motivo y respaldo documental." }
      - { n: AprobadoInterno,      d: "La organización lo aprobó; todavía no modifica el presupuesto." }
      - { n: AprobadoContractual,  d: "El comitente lo aceptó; habilita la nueva versión." }
      - { n: Vigente,              d: "Generó una versión de presupuesto nueva que ya rige." }
      - { n: Rechazado,            d: "No prosperó; el presupuesto vigente no cambia." }
    transiciones:
      - { de: Propuesto, a: AprobadoInterno, evento: "aprobar internamente", guarda: "datos completos y dentro del límite", cu: CU-11 }
      - { de: Propuesto, a: Rechazado, evento: "rechazar", cu: CU-11 }
      - { de: AprobadoInterno, a: AprobadoContractual, evento: "aprobar contractualmente", cu: CU-11 }
      - { de: AprobadoInterno, a: Rechazado, evento: "rechazar", cu: CU-11 }
      - { de: AprobadoContractual, a: Vigente, evento: "activar versión", cu: CU-11 }
  documento_financiero_erp:
    inicial: Registrado
    creado_en: [CU-10]
    finales: [Cobrado, Pagado]
    estados:
      - { n: Registrado, d: "Derivado de un certificado emitido: factura al cliente o pago al subcontratista." }
      - { n: Cobrado,    d: "Finanzas y Tesorería registró el cobro de la factura." }
      - { n: Aprobado,   d: "Finanzas y Tesorería aprobó el pago al subcontratista." }
      - { n: Pagado,     d: "Finanzas y Tesorería ejecutó el pago." }
    transiciones:
      - { de: Registrado, a: Cobrado, evento: "registrar cobro", guarda: "tipo factura", cu: CU-10 }
      - { de: Registrado, a: Aprobado, evento: "aprobar pago", guarda: "tipo pago", cu: CU-10 }
      - { de: Aprobado, a: Pagado, evento: "ejecutar pago", cu: CU-10 }
  periodo:
    inicial: Abierto
    finales: [Cerrado]
    estados:
      - { n: Abierto, d: "Admite el registro, la corrección y la aprobación de mediciones." }
      - { n: Cerrado, d: "Todas sus mediciones están aprobadas; no admite mediciones nuevas." }
    transiciones:
      - { de: Abierto, a: Cerrado, evento: "cerrar", guarda: "todas las mediciones aprobadas", cu: CU-06 }

# ------------------------------------------------------------------------------
# SECUENCIAS (diagrama de interacción). Derivan del mismo flujo de la especificación.
# frag: alt|else|loop|opt|end  -> fragmento combinado UML.
# tipo: sync (llamada) | return (respuesta) | create
# ------------------------------------------------------------------------------
secuencias:
  CU-01:
    participantes:
      - { id: ADM,  tipo: actor }
      - { id: CTRL, tipo: boundary,  ref: crear_obra_controlador }
      - { id: UC,   tipo: control,   ref: crear_obra_interactor }
      - { id: UREP, tipo: interface, ref: i_usuario_repositorio }
      - { id: OREP, tipo: interface, ref: i_obra_repositorio }
      - { id: AUD,  tipo: interface, ref: i_auditoria_repositorio }
      - { id: OBR,  tipo: entity,    ref: obra }
      - { id: ROL,  tipo: entity,    ref: rol_asignado }
    mensajes:
      - { de: ADM,  a: CTRL, msg: "nuevaObra(organizacionId)" }
      - { de: CTRL, a: UC,   msg: "prepararAlta(organizacionId)" }
      - { de: UC,   a: UREP, msg: "listarMiembros(organizacionId)" }
      - { de: UREP, a: UC,   msg: "miembros de la organización", tipo: return }
      - { de: UC,   a: CTRL, msg: "formulario y miembros", tipo: return }
      - { de: CTRL, a: ADM,  msg: "muestra el formulario y los miembros", tipo: return }
      - { de: ADM,  a: CTRL, msg: "crearObra(datosObra, responsables)" }
      - { de: CTRL, a: UC,   msg: "ejecutar(solicitudAlta, actorId)" }
      - { de: UC,   a: OREP, msg: "existeCodigo(codigo)" }
      - { de: OREP, a: UC,   msg: "verdadero | falso", tipo: return }
      - { frag: alt, etiqueta: "el código ya está en uso" }
      - { de: UC,   a: CTRL, msg: "codigoEnUso(codigo)", tipo: return }
      - { frag: else, etiqueta: "código disponible" }
      - { de: UC,   a: OBR,  msg: "crear(codigo, nombre, direccion, fechas, clienteId)", tipo: create }
      - { frag: loop, etiqueta: "por cada responsable de la organización" }
      - { de: UC,   a: ROL,  msg: "crear(usuarioId, rol, vigenteDesde)", tipo: create }
      - { frag: end }
      - { de: UC,   a: OREP, msg: "guardar(obra)" }
      - { de: UC,   a: AUD,  msg: "registrar(actor, fecha, obra, alta)" }
      - { de: UC,   a: CTRL, msg: "obraRegistrada(obraId)", tipo: return }
      - { frag: end }
      - { de: CTRL, a: ADM,  msg: "informa la obra creada y sus responsables", tipo: return }
  CU-02:
    participantes:
      - { id: ING,  tipo: actor }
      - { id: CTRL, tipo: boundary,  ref: importar_presupuesto_controlador }
      - { id: UC,   tipo: control,   ref: importar_presupuesto_interactor }
      - { id: VAL,  tipo: control,   ref: validar_estructura_servicio }
      - { id: TOT,  tipo: control,   ref: contrastar_totales_servicio }
      - { id: LEC,  tipo: interface, ref: i_lector_planilla }
      - { id: ALM,  tipo: interface, ref: i_almacen_archivos }
      - { id: REP,  tipo: interface, ref: i_presupuesto_repositorio }
      - { id: VER,  tipo: entity,    ref: version_presupuesto }
      - { id: LIN,  tipo: entity,    ref: linea_presupuesto }
    mensajes:
      - { de: ING,  a: CTRL, msg: "importarPresupuesto(obraId, archivo)" }
      - { de: CTRL, a: UC,   msg: "ejecutar(solicitudImportacion)" }
      - { de: UC,   a: ALM,  msg: "guardar(archivo)" }
      - { de: ALM,  a: UC,   msg: "{archivo_origen}(hashSHA256)", tipo: return }
      - { de: UC,   a: REP,  msg: "buscarPorHash(hashSHA256)" }
      - { de: REP,  a: UC,   msg: "versionExistente | nulo", tipo: return }
      - { frag: alt, etiqueta: "el archivo ya fue importado (RNF-07)" }
      - { de: UC,   a: CTRL, msg: "refiereVersionExistente(versionId)", tipo: return }
      - { frag: else, etiqueta: "archivo nuevo" }
      - { de: UC,   a: LEC,  msg: "leer(archivo)" }
      - { de: LEC,  a: UC,   msg: "hojas y filas reconocidas", tipo: return }
      - { frag: loop, etiqueta: "por cada fila de rubro, subrubro o ítem" }
      - { de: UC,   a: LIN,  msg: "crear(codigo, unidad, cantidad, precioUnitario)", tipo: create }
      - { frag: end }
      - { de: UC,   a: VAL,  msg: "validar(lineas)" }
      - { de: VAL,  a: UC,   msg: "incidencias(hoja, fila, columna)", tipo: return }
      - { de: UC,   a: TOT,  msg: "contrastar(totalDeclarado, totalRecalculado)" }
      - { de: TOT,  a: UC,   msg: "{informe_importacion}(diferencia, cuadra)", tipo: return }
      - { de: UC,   a: CTRL, msg: "previsualizacion(estructura, totales, incidencias)", tipo: return }
      - { de: CTRL, a: ING,  msg: "muestra estructura, ambos totales y datos inválidos", tipo: return }
      - { de: ING,  a: CTRL, msg: "confirmarImportacion(solicitudId)" }
      - { de: CTRL, a: UC,   msg: "confirmar(solicitudId)" }
      - { de: UC,   a: VER,  msg: "crear(numero, estado = Propuesta)", tipo: create }
      - { de: UC,   a: REP,  msg: "guardarVersion(version)" }
      - { de: UC,   a: CTRL, msg: "versionRegistrada(versionId)", tipo: return }
      - { frag: end }
      - { de: CTRL, a: ING,  msg: "informa el resultado de la importación", tipo: return }
  CU-03:
    participantes:
      - { id: ADM,  tipo: actor }
      - { id: CTRL, tipo: boundary,  ref: activar_version_controlador }
      - { id: UC,   tipo: control,   ref: activar_version_interactor }
